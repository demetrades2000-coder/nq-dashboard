<style>
/* ===== Liquidity Engine · PC-off command center (same design as web_next/css/next.css) ===== */
:root {
  color-scheme: dark;
  --page: #07080c; --surface: #10131a; --surface-2: #161a23; --surface-3: #1e2330;
  --ink: #eef1f8; --ink-2: #a9b1c3; --muted: #6f788b;
  --line: rgba(160, 170, 220, .10); --hover: rgba(238, 241, 248, .06);
  --accent: #6d7cff; --accent-2: #3ee0c8; --good: #2ee59d; --good-ink: #4ff0ae; --bad: #ff5a7a; --warn: #f7b955; --gold: #f2c35b;
  --bsl: #ff9b5c; --ssl: #6d9bff;
  --r: 18px; --gutter: 16px; --side: 248px;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-accent="teal"] { --accent: #2fd3c0; --accent-2: #6d7cff; }
:root[data-accent="gold"] { --accent: #e9b44c; --accent-2: #ff8f5a; }
:root[data-accent="rose"] { --accent: #ff6b9a; --accent-2: #b18cff; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--sans); font-feature-settings: "tnum", "cv11"; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; min-height: 100vh; min-height: 100dvh;
  background-image: radial-gradient(1100px 620px at 0% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(900px 560px at 100% 0%, color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 62%),
    radial-gradient(1200px 700px at 50% 120%, rgba(177, 140, 255, .07), transparent 60%);
  background-attachment: fixed; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 80%, transparent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
* { scrollbar-width: thin; scrollbar-color: rgba(238,241,248,.16) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: rgba(238,241,248,.14); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
.ico { flex: none; display: inline-block; vertical-align: -4px; }
.up { color: var(--good-ink); } .dn { color: var(--bad); } .wn { color: var(--warn); } .mut { color: var(--muted); } .mono { font-family: var(--mono); }
.small { font-size: 12px; }

/* shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding: 18px 12px 14px; overflow: auto;
  background: linear-gradient(180deg, rgba(16,19,26,.72), rgba(16,19,26,.55)); border-right: 1px solid var(--line); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 14px; }
.mark { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 22%, var(--surface-2)), var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 22px color-mix(in srgb, var(--accent) 28%, transparent); }
.mark img { width: 100%; height: 100%; border-radius: 12px; display: block; }
.mark { overflow: hidden; padding: 0; }
.brand b { display: block; font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; } .brand span { font-size: 11px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { position: relative; display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); font-weight: 550; text-decoration: none; transition: background .18s, color .18s; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a.on { color: var(--ink); background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 20%, transparent), color-mix(in srgb, var(--accent) 6%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent); }
.nav a.on::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 0 14px var(--accent); }
.nav a.on .ico { color: var(--accent); }
.nav .sec { font: 650 10.5px var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 18px 12px 6px; }
.nav a.pin { height: 36px; font-size: 13px; }
.side-foot { margin-top: auto; padding: 12px 14px; border-radius: 14px; background: rgba(22,26,35,.7); border: 1px solid var(--line); }
.side-foot .k { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.side-foot .v { font-weight: 650; margin-top: 2px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 24px; min-height: 64px;
  background: color-mix(in srgb, var(--page) 60%, transparent); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); border-bottom: 1px solid transparent; }
.scrolled .top { border-bottom-color: var(--line); }
.ttl { min-width: 0; flex: 1; }
.crumb { font: 600 11px var(--sans); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; } .crumb:empty { display: none; }
.ttl h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(22,26,35,.7); font: 600 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(46,229,157,.6); animation: pulse 1.8s infinite; }
.dot.off { background: var(--muted); animation: none; } .dot.warn { background: var(--warn); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,229,157,.55); } 70% { box-shadow: 0 0 0 9px rgba(46,229,157,0); } 100% { box-shadow: 0 0 0 0 rgba(46,229,157,0); } }
.iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: rgba(22,26,35,.7); color: var(--ink-2); transition: all .18s; }
.iconbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.iconbtn.spin .ico { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.sub { position: sticky; top: 64px; z-index: 25; padding: 6px 24px 0; }
.sub:empty { display: none; }
.strip { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 4px; border-radius: 14px; background: rgba(16,19,26,.7); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-weight: 550; font-size: 13px; white-space: nowrap; transition: all .18s; }
.strip button:hover { background: var(--hover); color: var(--ink); }
.strip button.on { color: var(--ink); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 26%, var(--surface-2)), color-mix(in srgb, var(--accent) 12%, var(--surface-2))); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.strip button.on .ico { color: var(--accent); }
.modbar { display: flex; gap: 8px; align-items: center; }
.chipbtn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(22,26,35,.75); color: var(--ink-2); font-size: 12.5px; font-weight: 550; white-space: nowrap; }
.chipbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.page { padding: 20px 24px 60px; max-width: 1400px; width: 100%; animation: in .32s var(--ease); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tabs { display: none; }

/* components */
.card { position: relative; border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px; min-width: 0;
  background: linear-gradient(180deg, rgba(16,19,26,.78), rgba(16,19,26,.62)); border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 20px 50px rgba(0,0,0,.28); backdrop-filter: blur(18px) saturate(1.25); -webkit-backdrop-filter: blur(18px) saturate(1.25); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.card-h h3 { margin: 0; font-size: 13.5px; font-weight: 650; }
.grid { display: grid; gap: 16px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.grid > .card { margin-bottom: 0; } .grid { margin-bottom: 16px; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin: 4px 0 20px; }
.hero > div:first-child { flex: 1 1 360px; min-width: 0; }
.hero h2 { margin: 6px 0; font-size: 28px; line-height: 1.15; font-weight: 750; letter-spacing: -.025em;
  background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--ink) 70%, var(--accent))); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 760px; }
.eyebrow { font: 650 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line);
  background: linear-gradient(160deg, rgba(22,26,35,.82), rgba(16,19,26,.6)); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
.stat::after { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 50%, transparent), transparent); }
.stat > span { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat b { font-size: 26px; font-weight: 750; letter-spacing: -.02em; } .stat em { font-style: normal; font-size: 12px; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 14px; }
.kv > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv span { font-size: 11.5px; color: var(--muted); font-weight: 550; } .kv b { font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
.kv.one { grid-template-columns: 1fr; gap: 0; }
.kv.one > div { flex-direction: row; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kv.one > div:last-child { border-bottom: 0; } .kv.one b { font-size: 13px; text-align: right; }
.big { font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -.035em; margin: 12px 0 16px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; font-weight: 550; color: var(--ink-2); white-space: nowrap;
  background: rgba(30,35,48,.7); border: 1px solid var(--line); }
.chip i { font-style: normal; color: var(--muted); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.chip.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { flex: none; align-self: flex-start; font-weight: 700; font-size: 12px; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.badge.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.empty { color: var(--muted); padding: 22px 6px; text-align: center; font-size: 13px; }
.note { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 12px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 15px; border-radius: 12px; font-weight: 600; font-size: 13px; white-space: nowrap; user-select: none;
  background: linear-gradient(180deg, #232837, var(--surface-2)); border: 1px solid rgba(238,241,248,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.3);
  transition: transform .12s var(--ease), border-color .18s, box-shadow .22s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.btn:active { transform: translateY(1px) scale(.985); }
.btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #fff 12%), var(--accent) 45%, color-mix(in srgb, var(--accent) 70%, var(--accent-2) 30%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 6px 22px color-mix(in srgb, var(--accent) 38%, transparent); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.icon { width: 40px; padding: 0; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; overflow-x: auto; scrollbar-width: none; max-width: 100%;
  background: rgba(7,8,12,.55); border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 12.5px; white-space: nowrap; transition: all .18s; }
.seg button:hover { color: var(--ink); background: var(--hover); }
.seg button.on { color: var(--ink); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 30%, var(--surface-3)), color-mix(in srgb, var(--accent) 16%, var(--surface-2)));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.seg.sm button { height: 26px; padding: 0 9px; font-size: 11.5px; border-radius: 7px; }
.field { position: relative; display: inline-flex; align-items: center; flex: 1 1 220px; min-width: 0; }
.field .ico { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }
.inp { width: 100%; min-height: 40px; padding: 0 12px 0 38px; border-radius: 12px; outline: none; -webkit-appearance: none; appearance: none;
  background: rgba(7,8,12,.6); border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); transition: border-color .18s, box-shadow .18s; font-size: 14px; }
.inp:focus { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.inp::placeholder { color: var(--muted); }
.dd { position: relative; display: inline-flex; min-width: 0; }
.dd-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; min-width: 150px; max-width: 100%; padding: 0 10px 0 13px; border-radius: 12px; text-align: left;
  background: linear-gradient(180deg, rgba(30,35,48,.8), rgba(22,26,35,.8)); border: 1px solid var(--line); font-weight: 550; font-size: 13px; }
.dd-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-btn .ico { color: var(--muted); transition: transform .2s; } .dd-btn.open .ico { transform: rotate(180deg); color: var(--accent); }
.dd-btn.open { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
.menu { position: fixed; z-index: 1000; overflow: auto; padding: 6px; border-radius: 14px; max-width: calc(100vw - 16px);
  background: rgba(16,19,26,.96); border: 1px solid rgba(238,241,248,.12); box-shadow: 0 24px 60px rgba(0,0,0,.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); animation: pop .16s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 38px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-size: 13px; text-align: left; }
.opt:hover, .opt:focus { background: var(--hover); color: var(--ink); outline: none; }
.opt.on { color: var(--ink); background: color-mix(in srgb, var(--accent) 16%, transparent); } .opt.on .ico { color: var(--accent); }
.opt small { color: var(--muted); font-family: var(--mono); }
.switch { -webkit-appearance: none; appearance: none; flex: none; width: 44px; height: 26px; margin: 0; border-radius: 99px; position: relative; cursor: pointer; background: var(--surface-3); border: 1px solid var(--line); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #dfe3ee; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .22s var(--ease); }
.switch:checked { background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--accent-2))); } .switch:checked::after { transform: translateX(18px); background: #fff; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; } .row > span { display: flex; flex-direction: column; gap: 2px; } .row b { font-weight: 600; }
input[type="range"] { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; cursor: pointer; width: 100%; --fill: 0%; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--accent) var(--fill), var(--surface-3) var(--fill)); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 99px; background: var(--surface-3); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 99px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent), 0 3px 10px rgba(0,0,0,.5); }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); }
.swatches { display: flex; gap: 10px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 2px rgba(0,0,0,.3); }
.swatch.on { border-color: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 50%, transparent); }

/* tables */
.tw { overflow: auto; border-radius: 12px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font: 600 11px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); background: rgba(16,19,26,.95); position: sticky; top: 0; white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid rgba(238,241,248,.05); white-space: nowrap; }
tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
th.sort { cursor: pointer; user-select: none; } th.sort.on { color: var(--ink); }
.sticky { position: sticky; left: 0; z-index: 1; background: rgba(16,19,26,.97); max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
th.sticky { z-index: 2; }

/* meters */
.meter { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; position: relative; }
.meter i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s var(--ease); }
.meter.good i { background: linear-gradient(90deg, color-mix(in srgb, var(--good) 70%, transparent), var(--good)); }
.meter.bad i { background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 70%, transparent), var(--bad)); }
.m2 { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--surface-3); }
.m2 .p { background: var(--good); } .m2 .f { background: var(--bad); margin-left: auto; }
.evgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.ev { padding: 12px; border-radius: 14px; background: rgba(22,26,35,.7); border: 1px solid var(--line); min-width: 0; }
.ev > span { font-size: 11px; font-weight: 600; color: var(--muted); }
.pf { display: flex; align-items: baseline; gap: 5px; margin: 6px 0 8px; flex-wrap: wrap; } .pf b { font-size: 17px; font-weight: 750; } .pf i { font-style: normal; font-size: 11px; color: var(--muted); margin-right: 6px; }
.runs { display: flex; flex-wrap: wrap; gap: 6px; }
.run { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
.run .ico { width: 14px; height: 14px; } .run i { font-style: normal; color: var(--muted); font-size: 11px; }
.run.pass { color: var(--good-ink); background: color-mix(in srgb, var(--good) 10%, transparent); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.run.fail { color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, transparent); border-color: color-mix(in srgb, var(--bad) 28%, transparent); }
.run.open { color: var(--warn); }

/* status hero */
.state { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.orb { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 60%, #fff 10%), color-mix(in srgb, var(--accent) 30%, var(--surface)) 60%, var(--surface));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 0 40px color-mix(in srgb, var(--accent) 40%, transparent); }
.orb.idle { filter: saturate(.3); }
.orb .ico { color: #fff; width: 26px; height: 26px; }
.state h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.state p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.state .px { margin-left: auto; text-align: right; }
.state .px b { display: block; font: 700 26px var(--mono); letter-spacing: -.02em; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }
.steps span { text-align: center; font: 650 10.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 8px 4px; border-radius: 10px; color: var(--muted); background: rgba(22,26,35,.7); border: 1px solid var(--line); }
.steps span.on { color: var(--ink); background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 25%, transparent); }
.steps span.done { color: var(--ink-2); }
.feed { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto; }
.evt { display: grid; grid-template-columns: 52px 1fr; gap: 10px; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: rgba(22,26,35,.6); border: 1px solid var(--line); }
.evt .t { font: 500 11.5px var(--mono); color: var(--muted); padding-top: 1px; }
.tag { display: inline-block; font: 700 10px var(--sans); letter-spacing: .08em; padding: 2px 7px; border-radius: 6px; margin-right: 6px; background: var(--surface-3); color: var(--ink-2); }
.tag.entry { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--ink); } .tag.exit { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-ink); }
.tag.sweep { background: color-mix(in srgb, var(--bsl) 18%, transparent); color: var(--bsl); } .tag.signal { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); }

/* trades */
.tlist { display: flex; flex-direction: column; gap: 8px; }
.trade { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 16px; border-radius: 16px; text-align: left; position: relative; overflow: hidden;
  background: linear-gradient(180deg, rgba(16,19,26,.76), rgba(16,19,26,.6)); border: 1px solid var(--line); transition: transform .15s var(--ease), border-color .18s, box-shadow .2s; }
.trade::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--muted); }
.trade.win::before { background: var(--good); box-shadow: 0 0 12px var(--good); } .trade.loss::before { background: var(--bad); }
.trade:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.side-i { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 12px; }
.side-i.L { color: var(--good-ink); background: color-mix(in srgb, var(--good) 12%, transparent); border: 1px solid color-mix(in srgb, var(--good) 30%, transparent); }
.side-i.S { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.tmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.ttop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
.sidetxt { font-weight: 700; font-size: 11px; letter-spacing: .08em; }
.tres { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
/* trade charts (tradechart.js): the Chart button on trade rows and the chart box at the top of a trade sheet */
.tcb { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: 999px; font: 600 12px var(--sans); color: var(--ink); background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); cursor: pointer; }
.tcb svg { width: 13px; height: 13px; } .tcb:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }
.tcbox { flex: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-height: 120px; }
@media (min-width: 760px) { .sheet.tc-wide { width: min(980px, calc(100vw - 24px)); } }
.tres b { font-size: 18px; font-weight: 750; } .tres span { font: 600 12.5px var(--mono); }
.more { display: flex; justify-content: center; margin: 16px 0; }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 900; }
.scrim { position: absolute; inset: 0; background: rgba(3,4,8,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .22s; }
.sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(560px, calc(100vw - 24px)); display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
  background: rgba(16,19,26,.96); border: 1px solid rgba(238,241,248,.1); box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateX(30px); opacity: 0; transition: transform .26s var(--ease), opacity .22s; }
.sheet-wrap.on .scrim { opacity: 1; } .sheet-wrap.on .sheet { transform: none; opacity: 1; }
.grab { display: none; }
.sh-h { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.sh-h > div:nth-child(2) { flex: 1; min-width: 0; } .sh-h h3 { margin: 4px 0 0; font-size: 16px; }
.sh-res { display: flex; flex-direction: column; align-items: flex-end; } .sh-res b { font-size: 22px; font-weight: 800; } .sh-res span { font: 600 12.5px var(--mono); }
.sh-b { flex: 1; overflow: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
.sh-b h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sh-b h4 .ico { color: var(--accent); width: 16px; height: 16px; }
.sh-b p { margin: 0; font-size: 13.5px; line-height: 1.55; }
.sh-f { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nums > div { padding: 10px 11px; border-radius: 12px; background: rgba(22,26,35,.7); border: 1px solid var(--line); min-width: 0; }
.nums span { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.nums b { display: block; margin-top: 2px; font: 650 13.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; line-height: 1.5; } .list li::marker { color: var(--accent); }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.check li { display: flex; align-items: center; gap: 9px; } .check .ico { width: 18px; height: 18px; padding: 2px; border-radius: 6px; }
.check .ok .ico { color: var(--good-ink); background: color-mix(in srgb, var(--good) 14%, transparent); } .check .no .ico { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.check .na { color: var(--muted); } .check .na .ico { background: var(--surface-3); }

/* charts */
.viz { position: relative; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viz svg { display: block; overflow: visible; }
.gl { stroke: rgba(238,241,248,.07); stroke-width: 1; } .zl { stroke: rgba(238,241,248,.22); stroke-width: 1; }
.ax { font: 500 10.5px var(--mono); fill: var(--muted); }
.cross { stroke: rgba(238,241,248,.3); stroke-dasharray: 3 3; }
.bar.pos { fill: var(--good); opacity: .82; } .bar.neg { fill: var(--bad); opacity: .82; } .bar.hl { opacity: 1; }
.tip { position: absolute; z-index: 5; pointer-events: none; display: flex; flex-direction: column; gap: 2px; padding: 8px 11px; border-radius: 11px; white-space: nowrap;
  background: rgba(30,35,48,.96); border: 1px solid rgba(238,241,248,.12); box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: 12px; }
.tip[hidden] { display: none; } .tip b { font-weight: 650; } .tip span { color: var(--ink-2); font: 11.5px var(--mono); }
.cu { fill: var(--good); stroke: var(--good); } .cd { fill: var(--bad); stroke: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* replay */
.rp-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.rp-ctl .rng { flex: 1 1 200px; min-width: 160px; }
.rp-time { font: 600 13px var(--mono); padding: 0 10px; min-width: 120px; text-align: right; }
.rp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
.narr { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow: auto; }
.narr .evt { animation: in .3s var(--ease); }

/* lessons / study / tiles */
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.lesson { padding: 15px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(16,19,26,.68); }
.lesson.good { border-color: color-mix(in srgb, var(--good) 30%, transparent); } .lesson.bad { border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.lesson > b { display: block; font-size: 15px; font-weight: 650; margin-top: 3px; }
.verdict { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); margin-top: 4px; } .verdict .ico { width: 14px; height: 14px; }
.verdict.good { color: var(--good-ink); } .verdict.bad { color: var(--bad); }
.lb { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.lb > div { padding: 9px 10px; border-radius: 11px; background: rgba(22,26,35,.7); display: flex; flex-direction: column; gap: 1px; }
.lb span { font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; } .lb b { font-size: 17px; font-weight: 700; } .lb i { font-style: normal; font-size: 11.5px; color: var(--ink-2); }
.study { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
/* recap cards, brief image, weekly review (tools/recap.py) */
.rc-img { display: block; width: 100%; height: auto; border-radius: 10px; background: #07080c; }
.rc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.rc-list .card { margin: 0; padding: 12px; } .rc-list .card h3 { margin: 8px 0 4px; font-size: 15px; }
.rc-txt h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.rc-txt ul { margin: 0; padding-left: 18px; } .rc-txt li { margin: 2px 0; } .rc-txt p { margin: 0; }
.wk-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line, #1a1f2b); align-items: baseline; }
.wk-row:first-child { border-top: 0; } .wk-row a { color: inherit; }
@media (max-width: 760px) { .rc-list { grid-template-columns: 1fr; } }
.study .card { padding: 0; overflow: hidden; margin: 0; }
.study img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
.study .sb { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; } .study h3 { margin: 0; font-size: 16px; text-transform: capitalize; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px 18px 16px; min-height: 148px; border-radius: 18px; text-align: left; overflow: hidden;
  background: linear-gradient(160deg, rgba(22,26,35,.82), rgba(16,19,26,.62)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); transition: transform .18s var(--ease), border-color .2s, box-shadow .25s; }
.tile:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 40%, transparent); box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.tile-i { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 8px; color: var(--accent);
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent-2) 8%, transparent)); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); }
.tile-t { font-size: 15px; font-weight: 680; } .tile-d { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.tile-b { position: absolute; top: 18px; right: 16px; font-size: 11px; font-weight: 650; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface-2); }
.tile-b:empty { display: none; } .tile-b.good { color: var(--good-ink); } .tile-b.warn { color: var(--warn); }
.tile-go { position: absolute; right: 14px; bottom: 14px; color: var(--muted); transition: transform .2s; } .tile:hover .tile-go { transform: translateX(3px); color: var(--accent); }
.steps5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.step { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(16,19,26,.66); }
.step-n { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; font-weight: 750; font-size: 12.5px; color: #0a0c14; margin-bottom: 4px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.step b { font-size: 14px; } .step span { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.rbars { display: flex; align-items: stretch; gap: 6px; height: 170px; }
.rbar { flex: 1; position: relative; min-width: 0; } .rbar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(238,241,248,.18); }
.rbar i { position: absolute; left: 12%; right: 12%; border-radius: 4px; } .rbar i.pos { background: linear-gradient(180deg, var(--good), color-mix(in srgb, var(--good) 50%, transparent)); }
.rbar i.neg { background: linear-gradient(0deg, var(--bad), color-mix(in srgb, var(--bad) 50%, transparent)); }
.calc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.calc > div { padding: 14px; border-radius: 14px; background: rgba(22,26,35,.7); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.calc span { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; } .calc b { font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
.skel { height: 92px; border-radius: 18px; margin-bottom: 12px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shim 1.3s infinite; }
@keyframes shim { to { background-position: -200% 0; } }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 1200; transform: translate(-50%, 30px); opacity: 0; transition: all .25s var(--ease); padding: 11px 16px; border-radius: 14px;
  background: rgba(30,35,48,.96); border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(0,0,0,.5); font-weight: 600; font-size: 13px; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ===== 3D layer (fx.js) ===== */
.fx-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.fx-bg .fx-canvas { width: 100% !important; height: 100% !important; display: block; }
.app { position: relative; z-index: 1; }
html[data-fx="max"] body, html[data-fx="lite"] body { background-image: none; }
/* with the 3D field on, surfaces turn to glass so the galaxy and grid show through */
html[data-fx="max"] .card, html[data-fx="lite"] .card { background: linear-gradient(180deg, rgba(13,15,23,.6), rgba(13,15,23,.44)); }
html[data-fx="max"] :is(.stat, .tile, .trade), html[data-fx="lite"] :is(.stat, .tile, .trade) { background: linear-gradient(160deg, rgba(22,24,38,.6), rgba(12,14,22,.4)); }
html[data-fx="max"] .card .card, html[data-fx="max"] .card :is(.stat, .trade) { background: rgba(10,11,18,.35); }
@media (max-width: 760px) { html[data-fx="max"] .tabs, html[data-fx="lite"] .tabs { background: rgba(14,16,24,.62); } }
.fx3d { position: relative; border-radius: 14px; overflow: hidden; background: radial-gradient(120% 90% at 50% 30%, #1c0838, #07030d 70%); touch-action: pan-y; }
.fx3d .fx-canvas { display: block; }
.fx3d.galaxy, .fx3d.city { height: 340px; } .fx3d.chart3d { height: 380px; } .fx3d.replay3d { height: 330px; }
@media (min-width: 761px) { .fx3d.galaxy, .fx3d.city { height: 440px; } .fx3d.chart3d { height: 480px; } .fx3d.replay3d { height: 430px; } }
.fx-card { padding-bottom: 16px; }
.hero-card { overflow: hidden; }
.hero3d { position: relative; height: 270px; margin: -18px -20px 14px; background: radial-gradient(90% 80% at 50% 40%, #2c0a52, #0e0420 55%, #030107); overflow: hidden; touch-action: pan-y; }
.hero3d .fx-canvas { display: block; position: absolute; inset: 0; }
.hero3d .hero-fallback { position: absolute; left: 50%; top: 50%; width: 196px; height: 196px; border-radius: 22%; transform: translate(-50%, -50%); box-shadow: 0 0 60px rgba(168,85,247,.45); animation: floaty 6s ease-in-out infinite; }
.hero3d.fx-live .hero-fallback { display: none; }
.hero-tag { position: absolute; left: 14px; top: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font: 650 10.5px var(--sans); letter-spacing: .08em;
  color: #f5e9ff; background: rgba(12,6,24,.55); border: 1px solid rgba(200,160,255,.22); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none; }
.hero-tag .ico { width: 14px; height: 14px; color: var(--accent-2); }
@keyframes floaty { 0%, 100% { transform: translate(-50%, -52%); } 50% { transform: translate(-50%, -47%); } }
/* neon trace: a light that runs around the edge of stat tiles and the hero */
@property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.stat::before, .hero-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 3;
  background: conic-gradient(from var(--ang), transparent 0 62%, color-mix(in srgb, var(--accent) 85%, #fff) 74%, var(--accent-2) 84%, transparent 94%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: trace 7s linear infinite; opacity: .9; }
.stat:nth-child(2)::before { animation-delay: -1.75s; } .stat:nth-child(3)::before { animation-delay: -3.5s; } .stat:nth-child(4)::before { animation-delay: -5.25s; }
@keyframes trace { to { --ang: 360deg; } }

let openDD = null;
function dropdown(el, opts, value, onChange) {

  if (!el) return;
  const cur = () => opts.find(o => String(o[0]) === String(value)) || opts[0];

    const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'listbox');

    document.body.appendChild(m);
    const r = btn.getBoundingClientRect();
    m.style.minWidth = Math.max(r.width, 200) + 'px';
    m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
    const below = innerHeight - r.bottom - 12, above = r.top - 12;

function tStats(rows) {
  const n = rows.length, w = rows.filter(t => t.pnl > 0), gp = w.reduce((a, t) => a + t.pnl, 0), gl = -rows.filter(t => t.pnl < 0).reduce((a, t) => a + t.pnl, 0);
  const days = rows.map(t => t.day).sort(); const wk = n ? Math.max(1, (Date.parse(days[days.length - 1]) - Date.parse(days[0])) / 6048e5) : 1;

    pm: n ? perMonth(gp - gl, days[0], days[days.length - 1]) : null };
}
