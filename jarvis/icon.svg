<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- Jarvis hub icon: the minimal Planner-style family (charcoal tile, grey glyph, one white glow): a ring with three arc
     segments around a glowing white core. Full bleed, opaque. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2e"/><stop offset="0.55" stop-color="#151517"/><stop offset="1" stop-color="#0b0b0d"/></linearGradient>
<radialGradient id="sheen" cx="512" cy="120" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="34"/></filter>
<filter id="glow2" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#sheen)"/>
<g id="art">
<circle cx="512" cy="512" r="292" fill="none" stroke="#6f7075" stroke-width="18"/>
<path d="M512 270 A242 242 0 0 1 721.6 391" fill="none" stroke="#c4c5ca" stroke-width="30" stroke-linecap="round"/>
<path d="M721.6 633 A242 242 0 0 1 512 754" fill="none" stroke="#c4c5ca" stroke-width="30" stroke-linecap="round"/>
<path d="M302.4 633 A242 242 0 0 1 302.4 391" fill="none" stroke="#c4c5ca" stroke-width="30" stroke-linecap="round"/>
<circle cx="512" cy="512" r="150" fill="#ffffff" opacity="0.30" filter="url(#glow)"/>
<circle cx="512" cy="512" r="96" fill="#ffffff" opacity="0.55" filter="url(#glow2)"/>
<circle cx="512" cy="512" r="78" fill="#f6f6f8"/>
</g>
</svg>
