<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="dark">
<title>Clip Engine</title>
<meta name="description" content="Clipping autopilot: clips, posts, views and estimated earnings.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* ===== Clip Engine · the same design system, components, motion and 3D layer as the NQ "Liquidity Engine" dashboard (index.html + fx.js) ===== */
:root {
  color-scheme: dark;
  --page: #07080c; --surface: #10131a; --surface-2: #161a23; --surface-3: #1e2330;
  --ink: #eef1f8; --ink-2: #aeb6c8; --muted: #8791a6;
  --c0: 7,8,12; --c1: 16,19,26; --c2: 22,26,35; --c3: 30,35,48; --cink: 238,241,248; --c1b: 13,15,23; --c2b: 22,24,38; --btn-top: #232837; --on-accent: #fff;
  --line: rgba(160, 170, 220, .10); --hover: rgba(238, 241, 248, .06);
  --accent: #6d7cff; --accent-2: #3ee0c8; --good: #2ee59d; --good-ink: #4ff0ae; --bad: #ff5a7a; --warn: #f7b955; --gold: #f2c35b; --violet: #b18cff;
  --tt: #2fe3dc; --ig: #d27bff; --yt: #ff5a5a;
  --r: 18px; --gutter: 16px; --side: 248px;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-accent="teal"] { --accent: #2fd3c0; --accent-2: #6d7cff; }
:root[data-accent="gold"] { --accent: #e9b44c; --accent-2: #ff8f5a; }
:root[data-accent="rose"] { --accent: #ff6b9a; --accent-2: #b18cff; }
:root[data-accent="emerald"] { --accent: #2ee59d; --accent-2: #38bdf8; --on-accent: #04130c; }
:root[data-accent="sky"] { --accent: #38bdf8; --accent-2: #6d7cff; --on-accent: #04121a; }
:root[data-accent="violet"] { --accent: #b18cff; --accent-2: #ff6b9a; }
:root[data-accent="orange"] { --accent: #ff8f5a; --accent-2: #f2c35b; --on-accent: #1a0c04; }
/* light theme: the same tokens, re-tinted. The 3D / canvas background is dark by design, so it is switched off here */
:root[data-theme="light"] { color-scheme: light; --page: #f1f3f9; --surface: #ffffff; --surface-2: #f4f6fb; --surface-3: #e6eaf3;
  --ink: #141828; --ink-2: #3e475c; --muted: #5b6579; --line: rgba(20, 24, 40, .12); --hover: rgba(20, 24, 40, .06);
  --good: #0d9f64; --good-ink: #0a7d4f; --bad: #d4264d; --warn: #b26a00; --gold: #b8860b; --accent-2: #0e9f8f;
  --c0: 255,255,255; --c1: 255,255,255; --c2: 244,246,251; --c3: 232,236,245; --cink: 20,24,40; --c1b: 255,255,255; --c2b: 244,246,251; --btn-top: #ffffff; }
:root[data-theme="light"][data-accent="indigo"], :root[data-theme="light"]:not([data-accent]) { --accent: #4a5bf0; }
:root[data-theme="light"][data-accent="teal"] { --accent: #0e9f8f; --accent-2: #4a5bf0; }
:root[data-theme="light"][data-accent="gold"] { --accent: #b8860b; --accent-2: #d2691e; }
:root[data-theme="light"][data-accent="rose"] { --accent: #d6336c; }
:root[data-theme="light"][data-accent="emerald"] { --accent: #0d9f64; --on-accent: #fff; }
:root[data-theme="light"][data-accent="sky"] { --accent: #0b84c6; --on-accent: #fff; }
:root[data-theme="light"][data-accent="violet"] { --accent: #7c4dff; }
:root[data-theme="light"][data-accent="orange"] { --accent: #d9570f; --on-accent: #fff; }
:root[data-theme="light"] body { background-image: radial-gradient(1000px 560px at 0% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%); }
:root[data-theme="light"] .fx-bg, :root[data-theme="light"] .bg2, :root[data-theme="light"] #splash { display: none !important; }
:root[data-theme="light"] .side { background: rgba(255,255,255,.8); }
:root[data-theme="light"] .card, :root[data-theme="light"] .stat, :root[data-theme="light"] .tile { box-shadow: 0 1px 2px rgba(20,24,40,.06), 0 10px 30px rgba(20,24,40,.06); }
:root[data-theme="light"] .btn { box-shadow: 0 1px 2px rgba(20,24,40,.12); border-color: rgba(20,24,40,.14); }
:root[data-theme="light"] .btn.primary { color: var(--on-accent); }
:root[data-theme="light"] .tabs { background: rgba(255,255,255,.9); }
:root[data-theme="light"] .hero h2 { background: none; -webkit-text-fill-color: var(--ink); color: var(--ink); }
:root[data-theme="light"] .sheet { background: rgba(255,255,255,.98); }
:root[data-theme="light"] .toast { background: #141828; color: #fff; }
:root[data-theme="light"] .clip .th, :root[data-theme="light"] .hero3d { box-shadow: 0 8px 22px rgba(20,24,40,.2); }
:root[data-theme="light"] .nav a.on, :root[data-theme="light"] .strip button.on, :root[data-theme="light"] .seg button.on, :root[data-theme="light"] .chiprow button.on { color: var(--ink); }
:root[data-theme="light"] th { background: rgba(255,255,255,.96); }
:root[data-theme="light"] .badge.acc, :root[data-theme="light"] .chip.acc { color: var(--ink); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--sans); font-feature-settings: "tnum", "cv11"; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  background-image: radial-gradient(1100px 620px at 0% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(900px 560px at 100% 0%, color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 62%),
    radial-gradient(1200px 700px at 50% 120%, rgba(177, 140, 255, .07), transparent 60%);
  background-attachment: fixed; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-2); }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 80%, transparent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
* { scrollbar-width: thin; scrollbar-color: rgba(var(--cink),.16) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: rgba(var(--cink),.14); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
.ico { flex: none; display: inline-block; vertical-align: -4px; }
.up { color: var(--good-ink); } .dn { color: var(--bad); } .wn { color: var(--warn); } .mut { color: var(--muted); } .mono { font-family: var(--mono); }
.small { font-size: 12px; }

/* shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; position: relative; z-index: 1; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding: 18px 12px 14px; overflow: auto;
  background: linear-gradient(180deg, rgba(var(--c1),.72), rgba(var(--c1),.55)); border-right: 1px solid var(--line); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 14px; }
.mark { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 12px; overflow: hidden; padding: 0; color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 55%, var(--surface-2)), color-mix(in srgb, var(--accent-2) 30%, var(--surface-2)));
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 22px color-mix(in srgb, var(--accent) 28%, transparent); }
.mark img { width: 100%; height: 100%; border-radius: 12px; display: block; }
.mark:has(img) { background: none; border-color: transparent; box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 22%, transparent); }
.brand b { display: block; font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; } .brand span { font-size: 11px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { position: relative; display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); font-weight: 550; text-decoration: none; transition: background .18s, color .18s; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a.on { color: var(--ink); background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 20%, transparent), color-mix(in srgb, var(--accent) 6%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent); }
.nav a.on::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 0 14px var(--accent); }
.nav a.on .ico { color: var(--accent); }
.nav .sec { font: 650 10.5px var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 18px 12px 6px; }
.nav a.g.cur { color: var(--ink); } .nav a.g.cur .ico { color: var(--accent); }
.nav .kids { display: none; flex-direction: column; gap: 1px; margin: 1px 0 8px 21px; padding-left: 10px; border-left: 1px solid var(--line); }
.nav .kids.on { display: flex; }
.nav .kids a { height: 34px; font-size: 13px; font-weight: 550; padding: 0 10px; border-radius: 10px; gap: 9px; }
.nav .kids a.on::before { left: -11px; top: 8px; bottom: 8px; }
.nav a .nb { margin-left: auto; font: 700 10.5px var(--mono); font-style: normal; padding: 2px 7px; border-radius: 99px; color: #fff; background: var(--accent); }
.nav a .nb.warn { color: #1a1205; background: var(--warn); }
.side-foot { margin-top: auto; padding: 12px 14px; border-radius: 14px; background: rgba(var(--c2),.7); border: 1px solid var(--line); }
.side-foot .k { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.side-foot .v { font-weight: 650; margin-top: 2px; font-size: 13px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 24px; min-height: 64px;
  background: color-mix(in srgb, var(--page) 60%, transparent); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); border-bottom: 1px solid transparent; }
.scrolled .top { border-bottom-color: var(--line); }
.ttl { min-width: 0; flex: 1; }
.crumb { font: 600 11px var(--sans); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; } .crumb:empty { display: none; }
.ttl h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(var(--c2),.7); font: 600 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(46,229,157,.6); animation: pulse 1.8s infinite; }
.dot.off { background: var(--muted); animation: none; } .dot.warn { background: var(--warn); animation: none; } .dot.bad { background: var(--bad); animation: none; box-shadow: 0 0 10px var(--bad); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,229,157,.55); } 70% { box-shadow: 0 0 0 9px rgba(46,229,157,0); } 100% { box-shadow: 0 0 0 0 rgba(46,229,157,0); } }
.iconbtn { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: rgba(var(--c2),.7); color: var(--ink-2); transition: all .18s; }
.iconbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.iconbtn.spin .ico { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.sub { position: sticky; top: 64px; z-index: 25; padding: 6px 24px 0; }
.sub:empty { display: none; }
.strip { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 4px; border-radius: 14px; background: rgba(var(--c1),.7); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-weight: 550; font-size: 13px; white-space: nowrap; transition: all .18s; }
.strip button:hover { background: var(--hover); color: var(--ink); }
.strip button.on { color: var(--ink); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 26%, var(--surface-2)), color-mix(in srgb, var(--accent) 12%, var(--surface-2))); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.strip button.on .ico { color: var(--accent); }
@media (min-width: 1101px) { .sub.grp { display: none; } }
.chipbtn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(var(--c2),.75); color: var(--ink-2); font-size: 12.5px; font-weight: 550; white-space: nowrap; text-decoration: none; max-width: 100%; }
.chipbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chipbtn.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.page { padding: 20px 24px 60px; max-width: 1400px; width: 100%; animation: in .32s var(--ease); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tabs { display: none; }

/* components */
.card { position: relative; border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px; min-width: 0;
  background: linear-gradient(180deg, rgba(var(--c1),.78), rgba(var(--c1),.62)); border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 20px 50px rgba(0,0,0,.28); backdrop-filter: blur(18px) saturate(1.25); -webkit-backdrop-filter: blur(18px) saturate(1.25); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.card-h h3 { margin: 0; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card-h h3 .ico { color: var(--accent); width: 16px; height: 16px; }
.card-h .meta { font-size: 12px; color: var(--muted); }
.card-h > div { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card-d { margin: -8px 0 14px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.grid { display: grid; gap: 16px; margin-bottom: 16px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } .g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
.span2 { grid-column: span 2; }
.grid > .card { margin-bottom: 0; } .grid.astart { align-items: start; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin: 2px 0 14px; }
.hero > div:first-child { flex: 1 1 360px; min-width: 0; }
.hero h2 { margin: 6px 0; font-size: 26px; line-height: 1.15; font-weight: 750; letter-spacing: -.025em;
  background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--ink) 70%, var(--accent))); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 760px; }
.hero-r { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.eyebrow { font: 650 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.howto { margin: 0 0 18px; border-radius: 14px; border: 1px solid var(--line); background: rgba(var(--c1),.55); }
.howto > summary { list-style: none; display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 14px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); user-select: none; -webkit-user-select: none; }
.howto > summary::-webkit-details-marker { display: none; }
.howto > summary .ico { width: 16px; height: 16px; color: var(--accent); }
.howto > summary .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
.howto[open] > summary .chev { transform: rotate(180deg); }
.howto-b { padding: 0 16px 14px 39px; font-size: 13px; line-height: 1.6; color: var(--ink-2); }
.howto-b p { margin: 0 0 8px; } .howto-b p:last-child { margin-bottom: 0; } .howto-b ul { margin: 0 0 8px; padding-left: 18px; } .howto-b li { margin: 3px 0; } .howto-b b { color: var(--ink); font-weight: 650; }
.sec-h { display: flex; align-items: center; gap: 12px; margin: 26px 2px 12px; font: 650 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sec-h > i { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.sec-h > em { font-style: normal; font: 600 11px var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
.page > .sec-h:first-child { margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stats.s4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); min-width: 0;
  background: linear-gradient(160deg, rgba(var(--c2),.82), rgba(var(--c1),.6)); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
.stat::after { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 50%, transparent), transparent); }
.stat > span { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat > span .ico { width: 14px; height: 14px; color: var(--accent); }
.stat b { font-size: 26px; font-weight: 750; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .stat em { font-style: normal; font-size: 12px; color: var(--ink-2); }
.stat .sp { display: block; width: 100%; height: 34px; margin-top: 6px; overflow: visible; }
.stat .mbar { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.stat .mbar > div { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px; align-items: center; font: 500 10.5px var(--mono); color: var(--muted); }
.stat .mbar i { display: block; height: 5px; border-radius: 99px; background: var(--c, var(--accent)); box-shadow: 0 0 8px var(--c, transparent); min-width: 2px; }
.stat .mbar b { font: 600 10.5px var(--mono); color: var(--ink-2); text-align: right; letter-spacing: 0; }
.stat.tone b { color: var(--tc); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 14px; }
.kv > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv span { font-size: 11.5px; color: var(--muted); font-weight: 550; } .kv b { font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
.kv.one { grid-template-columns: 1fr; gap: 0; }
.kv.one > div { flex-direction: row; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kv.one > div:last-child { border-bottom: 0; } .kv.one b { font-size: 13px; text-align: right; flex: none; overflow: visible; } .kv.one span { min-width: 0; }
.big { font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -.035em; margin: 12px 0 16px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; font-weight: 550; color: var(--ink-2); white-space: nowrap;
  background: rgba(var(--c3),.7); border: 1px solid var(--line); text-decoration: none; }
.chip .ico { width: 13px; height: 13px; }
.chip i { font-style: normal; color: var(--muted); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.chip.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.chip.acc { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.chip.pf { color: var(--ink); } .chip.pf::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); box-shadow: 0 0 8px var(--c, transparent); }
.chip.wrap { white-space: normal; height: auto; min-height: 24px; padding: 3px 9px; line-height: 1.35; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { flex: none; align-self: flex-start; font-weight: 700; font-size: 12px; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.badge.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.badge.acc { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.empty { color: var(--muted); padding: 22px 6px; text-align: center; font-size: 13px; }
.empty b { display: block; color: var(--ink-2); font-size: 14px; margin-bottom: 4px; } .empty .btn { margin-top: 12px; }
.note { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
.toolbar .grow { flex: 1; }
.lead { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; margin: 0; }
.hint { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent-2); font-size: inherit; text-decoration: underline; text-underline-offset: 2px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 15px; border-radius: 12px; font-weight: 600; font-size: 13px; white-space: nowrap; user-select: none; color: var(--ink); text-decoration: none;
  background: linear-gradient(180deg, var(--btn-top), var(--surface-2)); border: 1px solid rgba(var(--cink),.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.3);
  transition: transform .12s var(--ease), border-color .18s, box-shadow .22s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.btn:active { transform: translateY(1px) scale(.985); }
.btn.primary { color: var(--on-accent); border-color: transparent; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #fff 12%), var(--accent) 45%, color-mix(in srgb, var(--accent) 70%, var(--accent-2) 30%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 6px 22px color-mix(in srgb, var(--accent) 38%, transparent); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.icon { width: 40px; padding: 0; }

.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; overflow-x: auto; scrollbar-width: none; max-width: 100%;
  background: rgba(var(--c0),.55); border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 12.5px; white-space: nowrap; transition: all .18s; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); background: var(--hover); }
.seg button.on { color: var(--ink); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 30%, var(--surface-3)), color-mix(in srgb, var(--accent) 16%, var(--surface-2)));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.seg button i { font-style: normal; font: 600 10.5px var(--mono); color: var(--muted); }
.seg.sm button { height: 26px; padding: 0 9px; font-size: 11.5px; border-radius: 7px; }
.field { position: relative; display: inline-flex; align-items: center; flex: 1 1 220px; min-width: 0; }
.field .ico { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }
.inp { width: 100%; min-height: 40px; padding: 0 12px 0 38px; border-radius: 12px; outline: none; -webkit-appearance: none; appearance: none;
  background: rgba(var(--c0),.6); border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); transition: border-color .18s, box-shadow .18s; font-size: 14px; }

.switch { -webkit-appearance: none; appearance: none; flex: none; width: 44px; height: 26px; margin: 0; border-radius: 99px; position: relative; cursor: pointer; background: var(--surface-3); border: 1px solid var(--line); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #dfe3ee; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .22s var(--ease); }
.switch:checked { background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--accent-2))); } .switch:checked::after { transform: translateX(18px); background: #fff; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; } .row > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; } .row b { font-weight: 600; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 2px rgba(0,0,0,.3); }
.swatch.on { border-color: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 50%, transparent); }
.chiprow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: 0 0 12px; -webkit-overflow-scrolling: touch; }
.chiprow::-webkit-scrollbar { display: none; }
.chiprow button { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(var(--c2),.72); color: var(--ink-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: all .16s; }
.chiprow button i { font-style: normal; font: 600 11px var(--mono); color: var(--muted); }
.chiprow button .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.chiprow button.on { color: var(--ink); border-color: color-mix(in srgb, var(--c, var(--accent)) 60%, transparent); background: color-mix(in srgb, var(--c, var(--accent)) 16%, rgba(var(--c2),.8)); }
.chiprow button.on i { color: var(--ink-2); }

/* tables */
.tw { overflow: auto; border-radius: 12px; -webkit-overflow-scrolling: touch; max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font: 600 11px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); background: rgba(var(--c1),.95); position: sticky; top: 0; white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid rgba(var(--cink),.05); white-space: nowrap; }
td.wrap { white-space: normal; min-width: 200px; }
tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.num { text-align: right; font-family: var(--mono); } th.num { text-align: right; font-family: var(--sans); }
tr.click { cursor: pointer; }

/* meters */
.meter { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; position: relative; }
.meter i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s var(--ease); }
.meter.good i { background: linear-gradient(90deg, color-mix(in srgb, var(--good) 70%, transparent), var(--good)); }
.meter.bad i { background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 70%, transparent), var(--bad)); }
.meter.warn i { background: linear-gradient(90deg, color-mix(in srgb, var(--warn) 70%, transparent), var(--warn)); }
.meter.sm { height: 5px; }

/* status hero (Today) */
.state { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.state > div:first-child { flex: 1 1 280px; min-width: 0; }
.state h2 { margin: 4px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.state p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.state .px { margin-left: auto; text-align: right; display: flex; flex-direction: column; }
.state .px b { display: block; font: 700 30px var(--mono); letter-spacing: -.02em; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }

.steps span.on { color: var(--ink); background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 25%, transparent); }
.steps span.done { color: var(--ink-2); }
.cds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.cds > div { padding: 12px 14px; border-radius: 14px; background: rgba(var(--c2),.7); border: 1px solid var(--line); min-width: 0; }
.cds span { display: block; font: 600 10.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.cd { font: 700 26px var(--mono); letter-spacing: -.02em; line-height: 1; white-space: nowrap; } .cd.soon { color: var(--warn); } .cd.now { color: var(--accent-2); }
.cds .cd-t { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcline { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 14px; padding: 9px 12px; border-radius: 12px; font-size: 12.5px; color: var(--ink-2); background: rgba(var(--c2),.6); border: 1px solid var(--line); }
.pcline > span:nth-child(2) { flex: 1 1 200px; min-width: 0; }
.hero-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.banner { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; padding: 12px 16px; border-radius: 16px; font-size: 13px; line-height: 1.5; color: var(--ink-2);
  background: color-mix(in srgb, var(--accent) 8%, rgba(var(--c1),.6)); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.banner .ico { color: var(--accent); flex: none; margin-top: 1px; } .banner b { color: var(--ink); }
.banner.warn { background: color-mix(in srgb, var(--warn) 8%, rgba(var(--c1),.6)); border-color: color-mix(in srgb, var(--warn) 40%, transparent); } .banner.warn .ico, .banner.warn b { color: var(--warn); }

/* pipeline (copied from the NQ setup pipeline) */
.pipe { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pipe::before { content: ""; position: absolute; left: 10%; right: 10%; top: 25px; height: 2px; background: linear-gradient(90deg, rgba(143,155,255,.15), rgba(143,155,255,.45), rgba(143,155,255,.15)); }
.pn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.pn > i { position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font: 750 14px var(--mono); font-style: normal; color: var(--ink-2);
  background: #0d0a1a; border: 1px solid rgba(143,155,255,.28); }
.pn.done > i { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 12%, #0d0a1a); }
.pn.on > i { color: #fff; border-color: transparent; background: radial-gradient(circle at 35% 30%, #b9a6ff, var(--accent) 60%); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent), 0 0 30px var(--accent); }
.pn b { font-size: 12.5px; color: var(--ink-2); } .pn.on b { color: var(--ink); } .pn span { font-size: 11px; color: var(--muted); line-height: 1.35; }
.pn .cv { position: absolute; top: 17px; left: 0; transform: translateX(-50%); z-index: 2; font: 600 10px var(--mono); color: var(--accent-2); background: var(--page); padding: 1px 5px; border-radius: 99px; border: 1px solid var(--line); }
.pipe-s { margin-top: 18px; text-align: center; font-size: 13px; color: var(--ink-2); }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 900; }
.scrim { position: absolute; inset: 0; background: rgba(3,4,8,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .22s; }
.sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(600px, calc(100vw - 24px)); display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
  background: rgba(var(--c1),.96); border: 1px solid rgba(var(--cink),.1); box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateX(30px); opacity: 0; transition: transform .26s var(--ease), opacity .22s; }
.sheet-wrap.on .scrim { opacity: 1; } .sheet-wrap.on .sheet { transform: none; opacity: 1; }
.grab { display: none; }
.sh-h { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.sh-h > div:nth-child(2) { flex: 1; min-width: 0; } .sh-h h3 { margin: 4px 0 0; font-size: 16px; line-height: 1.3; }
.sh-res { display: flex; flex-direction: column; align-items: flex-end; flex: none; } .sh-res b { font-size: 22px; font-weight: 800; white-space: nowrap; } .sh-res span { font: 600 12.5px var(--mono); }
.sh-b { flex: 1; overflow: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
.sh-b h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sh-b h4 .ico { color: var(--accent); width: 16px; height: 16px; }
.sh-b h4 .btn { margin-left: auto; text-transform: none; letter-spacing: 0; }
.sh-b p { margin: 0; font-size: 13.5px; line-height: 1.55; }
.sh-f { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nums > div { padding: 10px 11px; border-radius: 12px; background: rgba(var(--c2),.7); border: 1px solid var(--line); min-width: 0; }
.nums span { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.nums b { display: block; margin-top: 2px; font: 650 13.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.check li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); } .check li:last-child { border-bottom: 0; }
.check li > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.check li small { color: var(--ink-2); font-size: 12px; line-height: 1.45; }
.check .ico { width: 22px; height: 22px; padding: 3px; border-radius: 7px; flex: none; }
.check .ok > .ico { color: var(--good-ink); background: color-mix(in srgb, var(--good) 14%, transparent); } .check .no > .ico { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.check .na > .ico { color: var(--muted); background: rgba(var(--cink),.06); }
.check.tight { gap: 0; font-size: 12.5px; } .check.tight li { padding: 7px 0; gap: 9px; } .check.tight .ico { width: 20px; height: 20px; } .check.tight li small { font-size: 11.5px; }
.cap { white-space: pre-wrap; font: 12.5px/1.55 var(--mono); color: var(--ink-2); background: rgba(var(--c0),.5); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; }
.hook { font-size: 17px !important; font-weight: 650; line-height: 1.4 !important; color: var(--ink); padding-left: 12px; border-left: 3px solid var(--accent); }

/* charts */
.viz { position: relative; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viz svg { display: block; overflow: visible; }
.gl { stroke: rgba(var(--cink),.07); stroke-width: 1; } .zl { stroke: rgba(var(--cink),.22); stroke-width: 1; }
.ax { font: 500 10.5px var(--mono); fill: var(--muted); }
.cross { stroke: rgba(var(--cink),.3); stroke-dasharray: 3 3; }
.bar { opacity: .85; } .bar.hl { opacity: 1; filter: brightness(1.2); }
.tip { position: absolute; z-index: 5; pointer-events: none; display: flex; flex-direction: column; gap: 2px; padding: 8px 11px; border-radius: 11px; white-space: nowrap;
  background: rgba(var(--c3),.96); border: 1px solid rgba(var(--cink),.12); box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: 12px; }
.tip[hidden] { display: none; } .tip b { font-weight: 650; } .tip span { color: var(--ink-2); font: 11.5px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.pt { cursor: pointer; }
.ring-w { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ring-w svg { flex: none; display: block; }
.ring-w .ring-k { flex: 1 1 180px; min-width: 0; }
.rt { font: 800 22px var(--sans); fill: var(--ink); letter-spacing: -.02em; } .rs { font: 600 10px var(--sans); fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.arc { transition: stroke-dasharray .9s var(--ease); }
.donut-w { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut-w svg { flex: none; }
.dl-list { flex: 1 1 180px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.dl-list > div { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.dl-list > div > i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.dl-list > div > em { grid-column: 2 / 4; font-style: normal; font: 500 11.5px var(--mono); color: var(--muted); }
.dl-list b { font: 650 13px var(--mono); }
.h24 { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 2px; font: 500 10px var(--mono); }
.h24 .hy, .h24 .hx { color: var(--muted); display: grid; place-items: center; height: 18px; } .h24 .hy { height: auto; justify-content: start; }
.h24 .c { height: 24px; border-radius: 5px; background: var(--surface-3); border: 1px solid transparent; padding: 0; min-width: 0; }
.h24 .c.on { border-color: #fff; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
.h24 .c.z { background: rgba(var(--cink),.035); cursor: default; }
.heat-i { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); min-height: 20px; } .heat-i b { color: var(--ink); }
.scale { display: flex; align-items: center; gap: 6px; font: 500 10.5px var(--mono); color: var(--muted); }
.scale i { display: block; width: 14px; height: 10px; border-radius: 3px; }
.cal { display: grid; grid-template-rows: repeat(7, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
.cal .c { aspect-ratio: 1; max-height: 26px; border-radius: 5px; background: var(--surface-3); border: 1px solid transparent; padding: 0; min-width: 0; }
.cal .c.pad { visibility: hidden; } .cal .c.today { box-shadow: inset 0 0 0 1.5px var(--accent-2); }
.cal .c.on { border-color: #fff; }
.cal-w { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; }
.cal-d { display: grid; grid-template-rows: repeat(7, minmax(0, 1fr)); gap: 3px; font: 500 9.5px var(--mono); color: var(--muted); }
.cal-d span { display: flex; align-items: center; }
.streaks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.streaks > div { padding: 10px 12px; border-radius: 12px; background: rgba(var(--c2),.7); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.streaks span { font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; } .streaks b { font: 750 20px var(--sans); letter-spacing: -.02em; }
.streaks b .ico { color: var(--warn); width: 18px; height: 18px; vertical-align: -2px; }

/* leaderboards / lists */
.lbd { display: flex; flex-direction: column; }
.lbd > .li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; }
.lbd > .li:last-child { border-bottom: 0; }
.lbd .rk { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font: 750 12px var(--mono); color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); grid-row: span 2; }
.lbd .li:nth-child(1) .rk { color: #1a1205; background: linear-gradient(135deg, var(--gold), #ffe7a3); border-color: transparent; box-shadow: 0 0 16px color-mix(in srgb, var(--gold) 45%, transparent); }
.lbd .li:nth-child(2) .rk { color: #0d1018; background: linear-gradient(135deg, #cfd6e6, #f4f6fb); border-color: transparent; }

.lbd .lt { min-width: 0; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbd .lv { font: 650 13px var(--mono); text-align: right; white-space: nowrap; }
.lbd .ls { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.lbd .ls .meter { flex: 1; min-width: 40px; }
button.li:hover .lt, a.li:hover .lt { color: var(--accent-2); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(var(--c2),.55); min-width: 0; }
.item .grow { flex: 1; min-width: 0; } .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.item .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.col { flex-direction: column; align-items: stretch; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert > .ai { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--tc); background: color-mix(in srgb, var(--tc) 13%, transparent); border: 1px solid color-mix(in srgb, var(--tc) 32%, transparent); }
.alert > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; } .alert small { color: var(--ink-2); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.alert .btn { flex: none; }
.feed { display: flex; flex-direction: column; }
.evt { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; font-size: 13px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.evt:last-child { border-bottom: 0; }
.evt .t { font: 500 11.5px var(--mono); color: var(--muted); padding-top: 3px; }
.evt .m { display: flex; gap: 8px; align-items: flex-start; min-width: 0; } .evt .m > span:last-child { min-width: 0; overflow-wrap: anywhere; color: var(--ink-2); }
.tag { display: inline-block; flex: none; font: 700 9.5px var(--sans); letter-spacing: .08em; padding: 3px 7px; border-radius: 6px; margin-top: 1px; background: var(--surface-3); color: var(--ink-2); text-transform: uppercase; }
.tag.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-ink); } .tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.tag.error { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); } .tag.info { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); }
.act-day { padding: 14px 0 4px; font: 650 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); } .act-day:first-child { padding-top: 0; }

/* tiles (platforms, quick links) with desktop 3D tilt */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px 18px 16px; min-height: 148px; border-radius: 18px; text-align: left; overflow: hidden; color: inherit; text-decoration: none;
  background: linear-gradient(160deg, rgba(var(--c2),.82), rgba(var(--c1),.62)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); transition: transform .18s var(--ease), border-color .2s, box-shadow .25s; }
.tile:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c, var(--accent)) 40%, transparent); box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.tile-i { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 8px; color: var(--c, var(--accent));
  background: linear-gradient(145deg, color-mix(in srgb, var(--c, var(--accent)) 22%, transparent), color-mix(in srgb, var(--accent-2) 8%, transparent)); border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 28%, transparent); }
.tile-t { font-size: 15px; font-weight: 680; } .tile-d { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.tile-v { font: 800 26px var(--sans); letter-spacing: -.02em; }
.tile-b { position: absolute; top: 18px; right: 16px; font-size: 11px; font-weight: 650; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface-2); }
.tile .kv { width: 100%; margin-top: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile .meter { width: 100%; margin-top: 6px; }

/* clip gallery: 9:16 cards */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px 14px; }
.clip { position: relative; display: flex; flex-direction: column; gap: 7px; padding: 0; border: 0; background: none; text-align: left; color: inherit; min-width: 0; font: inherit; }
.clip .th { position: relative; display: block; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 70% at 50% 20%, color-mix(in srgb, var(--accent) 35%, #111628), #090b12 70%); box-shadow: 0 14px 34px rgba(0,0,0,.38);
  transition: transform .2s var(--ease), box-shadow .25s, border-color .2s; transform-style: preserve-3d; }
.clip .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.clip .th::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(5,6,10,.55), transparent 22%, transparent 52%, rgba(5,6,10,.92)); }
.clip .ph { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px 14px; text-align: center; }
.clip .th.noimg .ph { display: flex; }
.clip .ph i { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: color-mix(in srgb, var(--accent) 40%, transparent); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 50%, transparent); }
.clip .ph em { font-style: normal; font-size: 12.5px; font-weight: 650; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.clip .tl { position: absolute; left: 8px; top: 8px; z-index: 2; display: flex; gap: 4px; }
.clip .tl .chip { height: 20px; padding: 0 7px; font-size: 10.5px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); background: rgba(10,12,18,.62); }
.clip .sc { position: absolute; right: 8px; top: 8px; z-index: 2; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; font: 750 12px var(--mono); color: var(--ink);
  background: rgba(10,12,18,.62); border: 1px solid color-mix(in srgb, var(--sc, var(--accent)) 55%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--sc, var(--accent)) 35%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.clip .bt { position: absolute; left: 10px; right: 10px; bottom: 9px; z-index: 2; display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; }
.clip .bt > span { display: flex; flex-direction: column; min-width: 0; }
.clip .bt b { display: flex; align-items: center; gap: 4px; font: 800 17px var(--sans); letter-spacing: -.02em; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.clip .bt b .ico { width: 15px; height: 15px; }
.clip .bt em { font-style: normal; font: 650 11.5px var(--mono); color: var(--good-ink); text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.clip .pl { display: flex; gap: 4px; padding-bottom: 3px; } .clip .pl i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); border: 1px solid rgba(0,0,0,.4); }
.clip .du { position: absolute; right: 8px; top: 44px; z-index: 2; font: 600 10px var(--mono); color: rgba(255,255,255,.85); background: rgba(0,0,0,.45); padding: 1px 6px; border-radius: 6px; }
.clip .ct { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding: 0 2px; }
.clip .cs { font-size: 11.5px; color: var(--muted); padding: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -3px; }
.clip:hover .th { border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 20px 44px rgba(0,0,0,.5), 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent); }
.clip:active .th { transform: scale(.97); transition: transform .08s; }
.cstrip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 8px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.cstrip > .clip { flex: 0 0 136px; scroll-snap-align: start; }
.cstrip > .clip .bt b { font-size: 15px; } .cstrip > .clip .du { display: none; }
.more { display: flex; justify-content: center; margin: 18px 0 4px; }
.clipd { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: start; }
.clipd .th { aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; position: relative; border: 1px solid var(--line); background: radial-gradient(120% 70% at 50% 20%, color-mix(in srgb, var(--accent) 35%, #111628), #090b12 70%); }
.clipd .th { display: block; } .clipd .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.clipd .th .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; text-align: center; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.clipd .nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.up-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(var(--c2),.55); }
.up-row + .up-row { margin-top: 8px; }
.up-row .u1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.up-row .u2 { grid-column: 1 / 3; display: flex; gap: 14px; flex-wrap: wrap; font: 500 12px var(--mono); color: var(--ink-2); } .up-row .u2 b { color: var(--ink); font-weight: 650; }
.up-row .u3 { grid-column: 1 / 3; }
.up-row .acts { display: flex; gap: 6px; }
.tl-bar { position: relative; height: 10px; border-radius: 99px; background: var(--surface-3); margin: 10px 0 6px; overflow: hidden; }
.tl-bar i { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px var(--accent); min-width: 6px; }

/* accounts (one card per posting account) + up next */
.acard .card-h { margin-bottom: 10px; }
.acard .card-h h3 { font-size: 15px; min-width: 0; } .acard .card-h h3 > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acard .pdot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.acard .capl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.acard .capl b { font: 700 20px var(--mono); color: var(--ink); letter-spacing: -.02em; } .acard .capl b i { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 600; }
.acard .nums { margin: 14px 0 0; }
.acard .sp { display: block; width: 100%; height: 44px; margin-top: 12px; overflow: visible; }
.acard .spl { display: flex; justify-content: space-between; font: 500 10.5px var(--mono); color: var(--muted); margin-top: 3px; }
.acard .anote { font-size: 12px; color: var(--ink-2); margin-top: 10px; line-height: 1.45; overflow-wrap: anywhere; }
.qline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin: -4px 0 14px; }
.qline b { color: var(--ink); font-weight: 650; }
.clip .to { position: absolute; left: 8px; right: 8px; bottom: 9px; z-index: 2; display: flex; }
.clip .to .chip { max-width: 100%; height: 22px; padding: 0 8px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; background: rgba(10,12,18,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.fmt { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fmt > div { padding: 14px 16px; border-radius: 14px; background: rgba(var(--c2),.7); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fmt span { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.fmt span .ico { color: var(--c, var(--accent)); width: 15px; height: 15px; }
.fmt b { font: 750 24px var(--sans); letter-spacing: -.02em; } .fmt em { font-style: normal; font-size: 12px; color: var(--ink-2); }
.fmt .meter { margin-top: 6px; } .fmt .meter i { background: var(--c, var(--accent)); }
.pay td { vertical-align: top; white-space: normal; } @media (max-width: 760px) { .pay td, .pay th { padding: 9px 6px; } } .pay td small { display: block; color: var(--muted); font: 500 11px var(--sans); }

/* goal ring card + projection */
.proj { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.proj > div { padding: 14px; border-radius: 14px; background: rgba(var(--c2),.7); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.proj span { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; } .proj b { font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
.proj em { font-style: normal; font-size: 12px; color: var(--ink-2); }
.ccard .card-h h3 { font-size: 15.5px; }
.ccard .nums { margin: 12px 0; }
.live { margin: 12px 0 0; padding: 12px 13px; border-radius: 14px; background: rgba(var(--c2),.7); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.live.paused { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 7%, rgba(var(--c2),.7)); }
.live-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .live-h .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.live-h .mut { margin-left: auto; font-size: 11.5px; }
.bud { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--ink-2); } .bud b { font: 650 13px var(--mono); color: var(--ink); } .bud em { font-style: normal; font: 500 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
.live-k { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); } .live-k b { color: var(--ink-2); font-weight: 600; }
.acm { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; } .acm .ico { flex: none; color: var(--accent-2); margin-top: 1px; } .acm b { color: var(--ink); }
.agy { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.agy > div { padding: 12px 14px; border-radius: 14px; background: rgba(var(--c2),.7); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.agy span { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); } .agy b { font: 750 22px var(--sans); letter-spacing: -.02em; } .agy em { font-style: normal; font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agy-p { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.agy-line { display: flex; align-items: center; gap: 8px 12px; flex-wrap: nowrap; font-size: 12.5px; color: var(--ink-2); } .agy-line b { color: var(--ink); } .agy-line > span { flex: 1; min-width: 0; } .agy-line > .ico { flex: none; color: var(--accent); } .agy-line .chipbtn { margin-left: auto; flex: none; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
.lcard { display: flex; flex-direction: column; gap: 10px; }
.lcard .lh { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.lcard .lh .rk { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font: 750 12px var(--mono); color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); grid-row: span 2; }
.lcard:nth-child(1) .rk { color: #1a1205; background: linear-gradient(135deg, var(--gold), #ffe7a3); border-color: transparent; }
.lcard .lh h3 { margin: 0; font-size: 14.5px; font-weight: 650; line-height: 1.3; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.lcard .lh small { grid-column: 2; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard .lh .sc { grid-row: span 2; grid-column: 3; text-align: right; font: 750 15px var(--mono); color: var(--accent-2); } .lcard .lh .sc i { display: block; font: 600 9.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-style: normal; }
.lcard .nums.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lcard .nums b small { font: 500 10.5px var(--sans); color: var(--muted); }
.lcard .btn { align-self: flex-start; margin-top: auto; }
.howadd { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--ink-2); line-height: 1.5; margin: 0 0 14px; } .howadd .ico { flex: none; color: var(--accent); margin-top: 2px; }
.ccard .cnote { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin: 10px 0 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.prob { display: flex; gap: 7px; align-items: flex-start; font-size: 12.5px; color: var(--warn); margin: 6px 0 0; line-height: 1.45; } .prob .ico { width: 15px; height: 15px; margin-top: 1px; }
.skel { height: 92px; border-radius: 18px; margin-bottom: 12px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shim 1.3s infinite; }
.skel.lg { height: 300px; }
@keyframes shim { to { background-position: -200% 0; } }
.sk-lines { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
.sk-lines i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shim 1.3s infinite; }
.sk-lines i:nth-child(3n) { width: 72%; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 1200; transform: translate(-50%, 30px); opacity: 0; transition: all .25s var(--ease); padding: 11px 16px; border-radius: 14px;
  background: rgba(var(--c3),.96); border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(0,0,0,.5); font-weight: 600; font-size: 13px; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
#ptr { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top)); z-index: 80; transform: translate(-50%, -60px); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2);
  background: rgba(var(--c2),.94); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; pointer-events: none; will-change: transform; }
#ptr.arm { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); } #ptr.go { transform: translate(-50%, 12px) !important; opacity: 1 !important; } #ptr.go .ico { animation: spin .8s linear infinite; }

/* ===== 3D layer (fx.js, shared with the NQ dashboard) + its 2D canvas fallback ===== */
.fx-bg, .bg2 { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

html[data-fx="max"] :is(.stat, .tile), html[data-fx="lite"] :is(.stat, .tile), html.bg2on :is(.stat, .tile) { background: linear-gradient(160deg, rgba(var(--c2b),.6), rgba(var(--c1b),.4)); }

  color: #e9dcff; background: rgba(12,6,24,.55); border: 1px solid rgba(200,160,255,.2); pointer-events: none; }

.hero-card { overflow: hidden; }

.hero3d .fx-canvas { display: block; position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.fx3d .fx-canvas { width: 100% !important; height: 100% !important; }
/* the reel ring: the latest clips as 9:16 cards orbiting a holographic play core; drag to spin, tap to open */
.reel { position: absolute; inset: 0; perspective: 900px; perspective-origin: 50% 38%; cursor: grab; user-select: none; -webkit-user-select: none; --R: 250px; --cw: 70px; }
.reel.drag { cursor: grabbing; }

.reel.drag .reel-stage { transition: none; }
.reel-ring { position: absolute; transform-style: preserve-3d; animation: reelspin 46s linear infinite; }
.reel:hover .reel-ring, .reel.drag .reel-ring { animation-play-state: paused; }
@keyframes reelspin { to { transform: rotateY(-360deg); } }
.rc { position: absolute; left: calc(var(--cw) / -2); top: calc(var(--cw) * -.89); width: var(--cw); aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; padding: 0; border: 0;
  transform: rotateY(var(--a)) translateZ(var(--R)); background: linear-gradient(160deg, #241552, #0b0620); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 70%, transparent), 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); cursor: pointer; }
.rc img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.rc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.22), transparent 38%), linear-gradient(0deg, rgba(5,2,15,.85), transparent 45%); pointer-events: none; }
.rc b svg { vertical-align: -1px; margin-right: 3px; }
.rc b { position: absolute; left: 6px; right: 6px; bottom: 5px; z-index: 1; font: 700 10.5px var(--sans); color: #fff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px #000; }
.rc i { position: absolute; top: 5px; left: 5px; z-index: 1; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.rc.empty { background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 6px, transparent 6px 12px), linear-gradient(160deg, #1a1040, #08041a); }
.rc.empty b { color: var(--muted); font-weight: 600; }
.rc .scan { position: absolute; left: 0; right: 0; height: 2px; top: 0; z-index: 1; background: linear-gradient(90deg, transparent, var(--c), transparent); opacity: .8; animation: rcscan 3.2s linear infinite; animation-delay: var(--d, 0s); }
@keyframes rcscan { from { transform: translateY(0); } to { transform: translateY(calc(var(--cw) * 1.78)); } }
.reel-core { position: absolute; left: -46px; top: -56px; width: 92px; height: 92px; transform: translateZ(0); display: grid; place-items: center; pointer-events: none; }
.reel-core::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: conic-gradient(from 0deg, #ff4fd8, #7c6cff, #3ee0c8, #ff4fd8); filter: blur(1px); opacity: .9; animation: corespin 6s linear infinite;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }
.reel-core::after { content: ""; position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(124,108,255,.45), transparent); animation: corepulse 2.6s ease-in-out infinite; }
@keyframes corespin { to { transform: rotate(360deg); } }
@keyframes corepulse { 50% { transform: scale(1.18); opacity: .55; } }
.reel-core span { position: relative; z-index: 1; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(124,108,255,.25) 45%, rgba(10,4,30,.85)); box-shadow: inset 0 0 18px rgba(255,255,255,.18), 0 0 30px rgba(124,108,255,.6); }
.reel-core svg { width: 26px; height: 26px; margin-left: 4px; filter: drop-shadow(0 0 8px #9ffff0); }
.reel-floor { position: absolute; left: 50%; top: 50%; width: calc(var(--R) * 2.3); height: calc(var(--R) * .42); transform: translate(-50%, 58%); border-radius: 50%; pointer-events: none;
  border: 1.5px solid rgba(62,224,200,.55); box-shadow: 0 0 22px rgba(62,224,200,.35), inset 0 0 26px rgba(255,79,216,.25); }
.reel-floor::after { content: ""; position: absolute; inset: 18%; border-radius: 50%; border: 1px dashed rgba(255,79,216,.45); animation: corespin 30s linear infinite; }
.reel-pop { position: absolute; left: var(--x); bottom: 26%; z-index: 2; pointer-events: none; font: 700 12px var(--mono, monospace); color: #9ffff0; padding: 3px 8px; border-radius: 99px; background: rgba(8,20,30,.6); border: 1px solid rgba(62,224,200,.45);
  box-shadow: 0 0 14px rgba(62,224,200,.35); opacity: 0; animation: reelpop 7s ease-out infinite; animation-delay: var(--d); white-space: nowrap; }
.reel-pop em { font-style: normal; color: var(--muted); font-weight: 600; margin-left: 4px; }
@keyframes reelpop { 0% { opacity: 0; transform: translateY(20px) scale(.9); } 10% { opacity: 1; transform: translateY(0) scale(1); } 45% { opacity: 1; } 60%, 100% { opacity: 0; transform: translateY(-120px) scale(.96); } }
.orb-spin { transform-origin: 260px 135px; animation: orbspin 14s linear infinite; } .orb-spin2 { transform-origin: 260px 135px; animation: orbspin 22s linear infinite reverse; }
@keyframes orbspin { to { transform: rotate(360deg); } }
.orb-float { animation: floaty2 6s ease-in-out infinite; } @keyframes floaty2 { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
.hero-tag { position: absolute; left: 14px; top: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font: 650 10.5px var(--sans); letter-spacing: .08em;
  color: #f5e9ff; background: rgba(12,6,24,.55); border: 1px solid rgba(200,160,255,.22); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none; }
.hero-tag .ico { width: 14px; height: 14px; color: var(--accent-2); }
.hero-tag.r { left: auto; right: 14px; }
/* neon trace: a light that runs around the edge of stat tiles and the hero */
@property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.stat::before, .hero-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 3;
  background: conic-gradient(from var(--ang), transparent 0 62%, color-mix(in srgb, var(--accent) 85%, #fff) 74%, var(--accent-2) 84%, transparent 94%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: trace 7s linear infinite; opacity: .9; }
.stat:nth-child(2)::before { animation-delay: -1.75s; } .stat:nth-child(3)::before { animation-delay: -3.5s; } .stat:nth-child(4)::before { animation-delay: -5.25s; }
.stat:nth-child(5)::before { animation-delay: -.9s; } .stat:nth-child(6)::before { animation-delay: -2.6s; } .stat:nth-child(7)::before { animation-delay: -4.4s; } .stat:nth-child(8)::before { animation-delay: -6.1s; }
@keyframes trace { to { --ang: 360deg; } }
/* cards rise in with a little 3D tilt, one after another */
html:not([data-fx="off"]) .page.entering > .card, html:not([data-fx="off"]) .page.entering > .grid > .card, html:not([data-fx="off"]) .page.entering > .stats > .stat, html:not([data-fx="off"]) .page.entering .tiles > .tile, html:not([data-fx="off"]) .page.entering .cgrid > .clip:nth-child(-n+12) {
  animation: rise .62s var(--ease) both; }
.page > :nth-child(2), .tiles > :nth-child(2), .stats > :nth-child(2), .cgrid > :nth-child(2) { animation-delay: .05s !important; } .page > :nth-child(3), .tiles > :nth-child(3), .stats > :nth-child(3), .cgrid > :nth-child(3) { animation-delay: .1s !important; }
.page > :nth-child(4), .tiles > :nth-child(4), .stats > :nth-child(4), .cgrid > :nth-child(4) { animation-delay: .15s !important; } .page > :nth-child(5), .tiles > :nth-child(5), .stats > :nth-child(5), .cgrid > :nth-child(5) { animation-delay: .2s !important; }
.page > :nth-child(n+6), .tiles > :nth-child(n+6), .stats > :nth-child(n+6), .cgrid > :nth-child(n+6) { animation-delay: .25s !important; }
@keyframes rise { from { opacity: 0; transform: perspective(900px) translateY(18px) rotateX(9deg) scale(.985); } to { opacity: 1; transform: none; } }
/* press-in depth + desktop hover tilt (JS sets --rx / --ry / --mx / --my) */
.tile, .stat { transform-style: preserve-3d; }
.tile:active, .stat:active { transform: scale(.97) !important; transition: transform .08s; }
@media (hover: hover) {
  .tile.tilt { transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-2px); }
  .clip.tilt .th { transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-3px); }
  .tile::after, .clip .th::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 3;
    background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.12), transparent 60%); }
  .tile.tilt::after, .clip.tilt .th::before { opacity: 1; }
}
/* splash: the orb with particles converging, first open per session */
#splash { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: radial-gradient(80% 60% at 50% 45%, #1b0f4d, #060413 60%, #020104); transition: opacity .55s var(--ease), transform .55s var(--ease); }
#splash.out { opacity: 0; transform: scale(1.08); pointer-events: none; }
#splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.sp-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.sp-logo { width: 132px; height: 132px; border-radius: 22%; display: grid; place-items: center; overflow: hidden; color: #fff; box-shadow: 0 0 80px rgba(109,124,255,.55), 0 0 0 1px rgba(255,255,255,.08); animation: sp-pop 1.1s var(--ease) both;
  background: linear-gradient(145deg, #6d7cff, #3ee0c8); }
.sp-logo img { width: 100%; height: 100%; display: block; }

.sp-logo:has(img) img { filter: drop-shadow(0 0 28px rgba(109,124,255,.55)) drop-shadow(0 0 60px rgba(62,224,200,.18)); }
.sp-t { font: 800 20px var(--sans); letter-spacing: .32em; margin-right: -.32em; background: linear-gradient(90deg, #fff, #c9d0ff, #7fe9ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: sp-fade .9s .35s var(--ease) both; }
.sp-s { font: 500 12px var(--sans); color: #9aa3c9; letter-spacing: .06em; animation: sp-fade .9s .5s var(--ease) both; }
.sp-bar { width: 160px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 6px; animation: sp-fade .6s .6s both; }
.sp-bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); animation: sp-load 1.1s ease-in-out infinite; }
@keyframes sp-pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

.page > .hero, .page > .hero-card { will-change: transform; }

// payout reality: per clip, how many views a post needs before it pays and where the cap stops it
function payoutCard() {
  const C = (D.campaigns || []).filter(c => c.posts || (c.payout && (c.payout.min_payout || c.payout.cap)));
  if (!C.length) return '';
  const rows = C.map(c => { const p = c.payout || {}; const share = p.posts ? p.posts_paying / p.posts : null;
    return `<tr><td style="white-space:normal;min-width:110px"><b style="font-weight:600">${esc(c.name)}</b><small>${moneyHidden() ? '' : usd(c.cpm) + ' per 1K views'}${c.min_views ? ` · ${kfmt(c.min_views)} views gate` : ''}</small></td>
      <td class="num">${p.min_payout ? usd(p.min_payout) : '<span class="mut">none</span>'}<small>${p.views_to_min ? `needs ${num(p.views_to_min)} views` : 'any view pays'}</small></td>
      <td class="num">${p.posts ? `<b class="${share >= .5 ? 'up' : share > 0 ? 'wn' : 'dn'}">${num(p.posts_paying)}</b> <span class="mut">of ${num(p.posts)}</span>` : '<span class="mut">—</span>'}</td>
      <td class="num hide-sm">${p.cap ? `${usd(p.cap, 0)}<small>at ${kfmt(p.views_to_cap)} views${p.posts_at_cap ? ` · ${num(p.posts_at_cap)} hit it` : ''}</small>` : '<span class="mut">no cap</span>'}</td></tr>`; }).join('');
  const under = sum(C, c => (c.payout || {}).posts - (c.payout || {}).posts_paying);
  return `<div class="card pay"><div class="card-h"><h3>${icon('target')}Payout reality</h3><span class="chip warn">${icon('info', 13)}per clip, not per account</span></div>
    <div class="tw"><table><thead><tr><th>Campaign</th><th class="num">Min a clip</th><th class="num">Posts over it</th><th class="num hide-sm">Max a clip</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="note">Views needed = the minimum payout ÷ the rate × 1,000 (or the campaign’s view gate, if higher). A post under it earns <b>nothing</b>, however many posts you make${under > 0 ? `: ${plural(under, 'post')} so far sit${under === 1 ? 's' : ''} below the line` : ''}. Above the cap a post earns no more. Counts are the tracker’s public views; the campaign pays on the views it verifies, after its review, and can reject posts.</div></div>`;
}

// format split: video clips vs TikTok photo slideshows
function formatHTML(fs) {
  const by = Object.fromEntries((fs || []).map(f => [f.kind, f])), list = ['video', 'slideshow'].map(k => by[k] || { kind: k, posts: 0, views: 0, avg_views: 0, engagement: 0 });
  if (!sum(list, f => f.posts)) return emptyBox('No posts yet.', 'Video clips and photo slideshows are compared here once both have posts.');
  const mx = Math.max(1, ...list.map(f => f.avg_views || 0)), [v, sl] = list;
  const verdict = v.posts && sl.posts ? (sl.avg_views > v.avg_views ? `Slideshows average <b>${pct(sl.avg_views / Math.max(1, v.avg_views) - 1, 0)}</b> more views a post` : `Videos average <b>${pct(v.avg_views / Math.max(1, sl.avg_views) - 1, 0)}</b> more views a post`) + ` (${plural(sl.posts, 'slideshow')}, ${plural(v.posts, 'video')}: small samples swing).` : `Only ${esc(v.posts ? 'videos' : 'slideshows')} so far.`;
  return `<div class="fmt">${list.map(f => { const K = KIND[f.kind] || KIND.video; return `<div style="--c:${K[2]}"><span>${icon(K[1])}${esc(K[0])}s</span><b>${f.posts ? kfmt(f.avg_views) : '—'}</b><em>avg views a post</em>
      <div class="meter sm"><i style="width:${(100 * (f.avg_views || 0) / mx).toFixed(1)}%"></i></div><em class="mono" style="margin-top:4px">${plural(f.posts || 0, 'post')} · ${kfmt(f.views || 0)} views · ${pct(f.engagement || 0)} eng.</em></div>`; }).join('')}</div>
    <div class="note">${verdict}</div>`;
}
