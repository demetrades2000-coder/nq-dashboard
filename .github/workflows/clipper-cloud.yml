name: clipper-cloud

# Clip Engine autopilot on GitHub Actions: free on a public repo, no PC, no Claude usage.
# Each run: wait for its slot, run one cloud_runner cycle (clip, post through Zernio, track, rebuild the dashboard,
# save state to the clipper-cloud branch), then start the next run. GitHub only runs `schedule:` workflows from the
# default branch (main, which the NQ bot replaces), so the runs chain themselves with workflow_dispatch instead.
# Start or restart the chain: Actions -> clipper-cloud -> Run workflow (branch claude/determined-shannon-94kfrp).
# Stop it: disable the workflow (Actions -> clipper-cloud -> ... -> Disable workflow).
on:
  push:   # editing this file (re)starts the chain
    paths: [".github/workflows/clipper-cloud.yml"]
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Minutes to wait before this cycle (the chain uses 240)"
        default: "0"

concurrency:
  group: clipper-cloud
  cancel-in-progress: false

permissions:
  contents: write   # save the state branch (clipper-cloud)
  actions: write    # start the next run

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUTF8: "1"
      CLIP_CLOUD_DIR: ${{ github.workspace }}/../clip-cloud
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: phone notifications through the free ntfy app
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for this run's slot
        run: |
          m="${{ inputs.wait_minutes }}"; m="${m:-0}"
          echo "waiting $m minutes"; sleep $(( m * 60 ))

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch as it is NOW: a run that waited hours must not use stale code
          fetch-depth: 5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clipper/requirements.txt

      - name: Install ffmpeg and packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install -q -r clipper/requirements.txt gdown

      - name: Git identity and push access for the state branch
        run: |
          git config --global user.name "clip-engine-cloud"
          git config --global user.email "clip-engine-cloud@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Autopilot cycle
        id: cycle
        continue-on-error: true
        run: python clipper/cloud_runner.py

      - name: Tell the owner if the cycle failed
        if: steps.cycle.outcome == 'failure' && env.NTFY_TOPIC != ''
        run: |
          curl -s -H "Title: Clip Engine run failed" -H "Priority: high" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               -d "The cycle hit an error. Tap to see why; the next run still starts." "https://ntfy.sh/${NTFY_TOPIC}" || true

      - name: Dashboard link
        if: always()
        run: |
          echo "Dashboard: https://raw.githack.com/${{ github.repository }}/clipper-cloud/site/index.html" >> "$GITHUB_STEP_SUMMARY"
          tail -c 3000 "$CLIP_CLOUD_DIR/ws/AUTOPILOT_REPORT.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Start the next run (in 4 hours)
        if: always()
        run: |
          # one chain only: skip if another clipper-cloud run is already queued or waiting
          others=$(gh run list --workflow clipper-cloud.yml --json databaseId,status \
                   -q "[.[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\") and .databaseId != ${{ github.run_id }})] | length")
          if [ "${others:-0}" -gt 0 ]; then echo "another run is already scheduled"; exit 0; fi
          gh workflow run clipper-cloud.yml --ref "${{ github.ref_name }}" -f wait_minutes=230
