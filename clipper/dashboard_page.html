<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="dark">
<title>Clip Engine</title>
<meta name="description" content="Clipping autopilot: clips, posts, views and estimated earnings.">

<link rel="icon" type="image/png" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* ===== Clip Engine · the same design system, components, motion and 3D layer as the NQ "Liquidity Engine" dashboard (index.html + fx.js) ===== */
:root {
  color-scheme: dark;
  --page: #07080c; --surface: #10131a; --surface-2: #161a23; --surface-3: #1e2330;
  --ink: #eef1f8; --ink-2: #a9b1c3; --muted: #6f788b;
  --line: rgba(160, 170, 220, .10); --hover: rgba(238, 241, 248, .06);
  --accent: #6d7cff; --accent-2: #3ee0c8; --good: #2ee59d; --good-ink: #4ff0ae; --bad: #ff5a7a; --warn: #f7b955; --gold: #f2c35b; --violet: #b18cff;
  --tt: #2fe3dc; --ig: #d27bff; --yt: #ff5a5a;
  --r: 18px; --gutter: 16px; --side: 248px;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-accent="teal"] { --accent: #2fd3c0; --accent-2: #6d7cff; }
:root[data-accent="gold"] { --accent: #e9b44c; --accent-2: #ff8f5a; }
:root[data-accent="rose"] { --accent: #ff6b9a; --accent-2: #b18cff; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--sans); font-feature-settings: "tnum", "cv11"; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  background-image: radial-gradient(1100px 620px at 0% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(900px 560px at 100% 0%, color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 62%),
    radial-gradient(1200px 700px at 50% 120%, rgba(177, 140, 255, .07), transparent 60%);
  background-attachment: fixed; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-2); }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 80%, transparent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
* { scrollbar-width: thin; scrollbar-color: rgba(238,241,248,.16) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: rgba(238,241,248,.14); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
.ico { flex: none; display: inline-block; vertical-align: -4px; }
.up { color: var(--good-ink); } .dn { color: var(--bad); } .wn { color: var(--warn); } .mut { color: var(--muted); } .mono { font-family: var(--mono); }
.small { font-size: 12px; }

/* shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; position: relative; z-index: 1; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding: 18px 12px 14px; overflow: auto;
  background: linear-gradient(180deg, rgba(16,19,26,.72), rgba(16,19,26,.55)); border-right: 1px solid var(--line); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 14px; }
.mark { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 12px; overflow: hidden; padding: 0; color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 55%, var(--surface-2)), color-mix(in srgb, var(--accent-2) 30%, var(--surface-2)));
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 22px color-mix(in srgb, var(--accent) 28%, transparent); }
.mark img { width: 100%; height: 100%; border-radius: 12px; display: block; }
.mark:has(img) { background: none; border-color: transparent; box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 22%, transparent); }
.brand b { display: block; font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; } .brand span { font-size: 11px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { position: relative; display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); font-weight: 550; text-decoration: none; transition: background .18s, color .18s; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a.on { color: var(--ink); background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 20%, transparent), color-mix(in srgb, var(--accent) 6%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent); }
.nav a.on::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 0 14px var(--accent); }
.nav a.on .ico { color: var(--accent); }
.nav .sec { font: 650 10.5px var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 18px 12px 6px; }
.nav a.g.cur { color: var(--ink); } .nav a.g.cur .ico { color: var(--accent); }
.nav .kids { display: none; flex-direction: column; gap: 1px; margin: 1px 0 8px 21px; padding-left: 10px; border-left: 1px solid var(--line); }
.nav .kids.on { display: flex; }
.nav .kids a { height: 34px; font-size: 13px; font-weight: 550; padding: 0 10px; border-radius: 10px; gap: 9px; }
.nav .kids a.on::before { left: -11px; top: 8px; bottom: 8px; }
.nav a .nb { margin-left: auto; font: 700 10.5px var(--mono); font-style: normal; padding: 2px 7px; border-radius: 99px; color: #fff; background: var(--accent); }
.nav a .nb.warn { color: #1a1205; background: var(--warn); }
.side-foot { margin-top: auto; padding: 12px 14px; border-radius: 14px; background: rgba(22,26,35,.7); border: 1px solid var(--line); }
.side-foot .k { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.side-foot .v { font-weight: 650; margin-top: 2px; font-size: 13px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 24px; min-height: 64px;
  background: color-mix(in srgb, var(--page) 60%, transparent); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); border-bottom: 1px solid transparent; }
.scrolled .top { border-bottom-color: var(--line); }
.ttl { min-width: 0; flex: 1; }
.crumb { font: 600 11px var(--sans); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; } .crumb:empty { display: none; }
.ttl h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(22,26,35,.7); font: 600 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(46,229,157,.6); animation: pulse 1.8s infinite; }
.dot.off { background: var(--muted); animation: none; } .dot.warn { background: var(--warn); animation: none; } .dot.bad { background: var(--bad); animation: none; box-shadow: 0 0 10px var(--bad); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,229,157,.55); } 70% { box-shadow: 0 0 0 9px rgba(46,229,157,0); } 100% { box-shadow: 0 0 0 0 rgba(46,229,157,0); } }
.iconbtn { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: rgba(22,26,35,.7); color: var(--ink-2); transition: all .18s; }
.iconbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.iconbtn.spin .ico { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.sub { position: sticky; top: 64px; z-index: 25; padding: 6px 24px 0; }
.sub:empty { display: none; }
.strip { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 4px; border-radius: 14px; background: rgba(16,19,26,.7); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-weight: 550; font-size: 13px; white-space: nowrap; transition: all .18s; }
.strip button:hover { background: var(--hover); color: var(--ink); }
.strip button.on { color: var(--ink); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 26%, var(--surface-2)), color-mix(in srgb, var(--accent) 12%, var(--surface-2))); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.strip button.on .ico { color: var(--accent); }
@media (min-width: 1101px) { .sub.grp { display: none; } }
.chipbtn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(22,26,35,.75); color: var(--ink-2); font-size: 12.5px; font-weight: 550; white-space: nowrap; text-decoration: none; max-width: 100%; }
.chipbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chipbtn.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.page { padding: 20px 24px 60px; max-width: 1400px; width: 100%; animation: in .32s var(--ease); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tabs { display: none; }

/* components */
.card { position: relative; border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px; min-width: 0;
  background: linear-gradient(180deg, rgba(16,19,26,.78), rgba(16,19,26,.62)); border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 20px 50px rgba(0,0,0,.28); backdrop-filter: blur(18px) saturate(1.25); -webkit-backdrop-filter: blur(18px) saturate(1.25); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.card-h h3 { margin: 0; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card-h h3 .ico { color: var(--accent); width: 16px; height: 16px; }
.card-h .meta { font-size: 12px; color: var(--muted); }
.card-h > div { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card-d { margin: -8px 0 14px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.grid { display: grid; gap: 16px; margin-bottom: 16px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } .g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
.span2 { grid-column: span 2; }
.grid > .card { margin-bottom: 0; } .grid.astart { align-items: start; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin: 2px 0 14px; }
.hero > div:first-child { flex: 1 1 360px; min-width: 0; }
.hero h2 { margin: 6px 0; font-size: 26px; line-height: 1.15; font-weight: 750; letter-spacing: -.025em;
  background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--ink) 70%, var(--accent))); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 760px; }
.hero-r { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.eyebrow { font: 650 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.howto { margin: 0 0 18px; border-radius: 14px; border: 1px solid var(--line); background: rgba(16,19,26,.55); }
.howto > summary { list-style: none; display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 14px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); user-select: none; -webkit-user-select: none; }
.howto > summary::-webkit-details-marker { display: none; }
.howto > summary .ico { width: 16px; height: 16px; color: var(--accent); }
.howto > summary .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
.howto[open] > summary .chev { transform: rotate(180deg); }
.howto-b { padding: 0 16px 14px 39px; font-size: 13px; line-height: 1.6; color: var(--ink-2); }
.howto-b p { margin: 0 0 8px; } .howto-b p:last-child { margin-bottom: 0; } .howto-b ul { margin: 0 0 8px; padding-left: 18px; } .howto-b li { margin: 3px 0; } .howto-b b { color: var(--ink); font-weight: 650; }
.sec-h { display: flex; align-items: center; gap: 12px; margin: 26px 2px 12px; font: 650 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sec-h > i { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.sec-h > em { font-style: normal; font: 600 11px var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
.page > .sec-h:first-child { margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stats.s4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); min-width: 0;
  background: linear-gradient(160deg, rgba(22,26,35,.82), rgba(16,19,26,.6)); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
.stat::after { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 50%, transparent), transparent); }
.stat > span { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat > span .ico { width: 14px; height: 14px; color: var(--accent); }
.stat b { font-size: 26px; font-weight: 750; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .stat em { font-style: normal; font-size: 12px; color: var(--ink-2); }
.stat .sp { display: block; width: 100%; height: 34px; margin-top: 6px; overflow: visible; }
.stat .mbar { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.stat .mbar > div { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px; align-items: center; font: 500 10.5px var(--mono); color: var(--muted); }
.stat .mbar i { display: block; height: 5px; border-radius: 99px; background: var(--c, var(--accent)); box-shadow: 0 0 8px var(--c, transparent); min-width: 2px; }
.stat .mbar b { font: 600 10.5px var(--mono); color: var(--ink-2); text-align: right; letter-spacing: 0; }
.stat.tone b { color: var(--tc); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 14px; }
.kv > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv span { font-size: 11.5px; color: var(--muted); font-weight: 550; } .kv b { font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
.kv.one { grid-template-columns: 1fr; gap: 0; }
.kv.one > div { flex-direction: row; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kv.one > div:last-child { border-bottom: 0; } .kv.one b { font-size: 13px; text-align: right; flex: none; overflow: visible; } .kv.one span { min-width: 0; }
.big { font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -.035em; margin: 12px 0 16px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; font-weight: 550; color: var(--ink-2); white-space: nowrap;
  background: rgba(30,35,48,.7); border: 1px solid var(--line); text-decoration: none; }
.chip .ico { width: 13px; height: 13px; }
.chip i { font-style: normal; color: var(--muted); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.chip.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.chip.acc { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.chip.pf { color: var(--ink); } .chip.pf::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); box-shadow: 0 0 8px var(--c, transparent); }
.chip.wrap { white-space: normal; height: auto; min-height: 24px; padding: 3px 9px; line-height: 1.35; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { flex: none; align-self: flex-start; font-weight: 700; font-size: 12px; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.badge.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.badge.acc { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.empty { color: var(--muted); padding: 22px 6px; text-align: center; font-size: 13px; }
.empty b { display: block; color: var(--ink-2); font-size: 14px; margin-bottom: 4px; } .empty .btn { margin-top: 12px; }
.note { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
.toolbar .grow { flex: 1; }
.lead { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; margin: 0; }
.hint { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent-2); font-size: inherit; text-decoration: underline; text-underline-offset: 2px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 15px; border-radius: 12px; font-weight: 600; font-size: 13px; white-space: nowrap; user-select: none; color: var(--ink); text-decoration: none;
  background: linear-gradient(180deg, #232837, var(--surface-2)); border: 1px solid rgba(238,241,248,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.3);
  transition: transform .12s var(--ease), border-color .18s, box-shadow .22s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.btn:active { transform: translateY(1px) scale(.985); }
.btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #fff 12%), var(--accent) 45%, color-mix(in srgb, var(--accent) 70%, var(--accent-2) 30%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 6px 22px color-mix(in srgb, var(--accent) 38%, transparent); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.icon { width: 40px; padding: 0; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 12px; border-radius: 10px; } .btn.sm.icon { width: 32px; padding: 0; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; overflow-x: auto; scrollbar-width: none; max-width: 100%;
  background: rgba(7,8,12,.55); border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 12.5px; white-space: nowrap; transition: all .18s; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); background: var(--hover); }
.seg button.on { color: var(--ink); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 30%, var(--surface-3)), color-mix(in srgb, var(--accent) 16%, var(--surface-2)));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.seg button i { font-style: normal; font: 600 10.5px var(--mono); color: var(--muted); }
.seg.sm button { height: 26px; padding: 0 9px; font-size: 11.5px; border-radius: 7px; }
.field { position: relative; display: inline-flex; align-items: center; flex: 1 1 220px; min-width: 0; }

.inp { width: 100%; min-height: 40px; padding: 0 12px 0 38px; border-radius: 12px; outline: none; -webkit-appearance: none; appearance: none;
  background: rgba(7,8,12,.6); border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); transition: border-color .18s, box-shadow .18s; font-size: 14px; }

.switch { -webkit-appearance: none; appearance: none; flex: none; width: 44px; height: 26px; margin: 0; border-radius: 99px; position: relative; cursor: pointer; background: var(--surface-3); border: 1px solid var(--line); transition: background .2s; }

.switch:checked { background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--accent-2))); } .switch:checked::after { transform: translateX(18px); background: #fff; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }

.swatch.on { border-color: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 50%, transparent); }
.chiprow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: 0 0 12px; -webkit-overflow-scrolling: touch; }
.chiprow::-webkit-scrollbar { display: none; }
.chiprow button { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(22,26,35,.72); color: var(--ink-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: all .16s; }

.chiprow button .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.chiprow button.on { color: var(--ink); border-color: color-mix(in srgb, var(--c, var(--accent)) 60%, transparent); background: color-mix(in srgb, var(--c, var(--accent)) 16%, rgba(22,26,35,.8)); }
.chiprow button.on i { color: var(--ink-2); }

/* tables */
.tw { overflow: auto; border-radius: 12px; -webkit-overflow-scrolling: touch; max-width: 100%; }

td.wrap { white-space: normal; min-width: 200px; }

.num { text-align: right; font-family: var(--mono); } th.num { text-align: right; font-family: var(--sans); }
tr.click { cursor: pointer; }

/* meters */

.meter i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s var(--ease); }
.meter.good i { background: linear-gradient(90deg, color-mix(in srgb, var(--good) 70%, transparent), var(--good)); }
.meter.bad i { background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 70%, transparent), var(--bad)); }
.meter.warn i { background: linear-gradient(90deg, color-mix(in srgb, var(--warn) 70%, transparent), var(--warn)); }

/* status hero (Today) */
.state { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

.cds .cd-t { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcline { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 14px; padding: 9px 12px; border-radius: 12px; font-size: 12.5px; color: var(--ink-2); background: rgba(22,26,35,.6); border: 1px solid var(--line); }

.hero-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.banner { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; padding: 12px 16px; border-radius: 16px; font-size: 13px; line-height: 1.5; color: var(--ink-2);
  background: color-mix(in srgb, var(--accent) 8%, rgba(16,19,26,.6)); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.banner .ico { color: var(--accent); flex: none; margin-top: 1px; } .banner b { color: var(--ink); }
.banner.warn { background: color-mix(in srgb, var(--warn) 8%, rgba(16,19,26,.6)); border-color: color-mix(in srgb, var(--warn) 40%, transparent); } .banner.warn .ico, .banner.warn b { color: var(--warn); }

/* pipeline (copied from the NQ setup pipeline) */
.pipe { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pipe::before { content: ""; position: absolute; left: 10%; right: 10%; top: 25px; height: 2px; background: linear-gradient(90deg, rgba(143,155,255,.15), rgba(143,155,255,.45), rgba(143,155,255,.15)); }
.pn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.pn > i { position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font: 750 14px var(--mono); font-style: normal; color: var(--ink-2);
  background: #0d0a1a; border: 1px solid rgba(143,155,255,.28); }
.pn.done > i { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 12%, #0d0a1a); }
.pn.on > i { color: #fff; border-color: transparent; background: radial-gradient(circle at 35% 30%, #b9a6ff, var(--accent) 60%); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent), 0 0 30px var(--accent); }
.pn b { font-size: 12.5px; color: var(--ink-2); } .pn.on b { color: var(--ink); } .pn span { font-size: 11px; color: var(--muted); line-height: 1.35; }
.pn .cv { position: absolute; top: 17px; left: 0; transform: translateX(-50%); z-index: 2; font: 600 10px var(--mono); color: var(--accent-2); background: var(--page); padding: 1px 5px; border-radius: 99px; border: 1px solid var(--line); }
.pipe-s { margin-top: 18px; text-align: center; font-size: 13px; color: var(--ink-2); }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 900; }

.sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(600px, calc(100vw - 24px)); display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
  background: rgba(16,19,26,.96); border: 1px solid rgba(238,241,248,.1); box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateX(30px); opacity: 0; transition: transform .26s var(--ease), opacity .22s; }
.sheet-wrap.on .scrim { opacity: 1; } .sheet-wrap.on .sheet { transform: none; opacity: 1; }
.grab { display: none; }
.sh-h { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.sh-h > div:nth-child(2) { flex: 1; min-width: 0; } .sh-h h3 { margin: 4px 0 0; font-size: 16px; line-height: 1.3; }
.sh-res { display: flex; flex-direction: column; align-items: flex-end; flex: none; } .sh-res b { font-size: 22px; font-weight: 800; white-space: nowrap; } .sh-res span { font: 600 12.5px var(--mono); }
.sh-b { flex: 1; overflow: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
.sh-b h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.sh-b h4 .btn { margin-left: auto; text-transform: none; letter-spacing: 0; }
.sh-b p { margin: 0; font-size: 13.5px; line-height: 1.55; }
.sh-f { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nums > div { padding: 10px 11px; border-radius: 12px; background: rgba(22,26,35,.7); border: 1px solid var(--line); min-width: 0; }
.nums span { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.nums b { display: block; margin-top: 2px; font: 650 13.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.check li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); } .check li:last-child { border-bottom: 0; }
.check li > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.check li small { color: var(--ink-2); font-size: 12px; line-height: 1.45; }
.check .ico { width: 22px; height: 22px; padding: 3px; border-radius: 7px; flex: none; }
.check .ok > .ico { color: var(--good-ink); background: color-mix(in srgb, var(--good) 14%, transparent); } .check .no > .ico { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.cap { white-space: pre-wrap; font: 12.5px/1.55 var(--mono); color: var(--ink-2); background: rgba(7,8,12,.5); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; }
.hook { font-size: 17px !important; font-weight: 650; line-height: 1.4 !important; color: var(--ink); padding-left: 12px; border-left: 3px solid var(--accent); }

/* charts */
.viz { position: relative; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.viz svg { display: block; overflow: visible; }
.gl { stroke: rgba(238,241,248,.07); stroke-width: 1; } .zl { stroke: rgba(238,241,248,.22); stroke-width: 1; }
.ax { font: 500 10.5px var(--mono); fill: var(--muted); }
.cross { stroke: rgba(238,241,248,.3); stroke-dasharray: 3 3; }
.bar { opacity: .85; } .bar.hl { opacity: 1; filter: brightness(1.2); }
.tip { position: absolute; z-index: 5; pointer-events: none; display: flex; flex-direction: column; gap: 2px; padding: 8px 11px; border-radius: 11px; white-space: nowrap;
  background: rgba(30,35,48,.96); border: 1px solid rgba(238,241,248,.12); box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: 12px; }
.tip[hidden] { display: none; } .tip b { font-weight: 650; } .tip span { color: var(--ink-2); font: 11.5px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.pt { cursor: pointer; }
.ring-w { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ring-w svg { flex: none; display: block; }
.ring-w .ring-k { flex: 1 1 180px; min-width: 0; }
.rt { font: 800 22px var(--sans); fill: var(--ink); letter-spacing: -.02em; } .rs { font: 600 10px var(--sans); fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.arc { transition: stroke-dasharray .9s var(--ease); }
.donut-w { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut-w svg { flex: none; }
.dl-list { flex: 1 1 180px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.dl-list > div { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.dl-list > div > i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.dl-list > div > em { grid-column: 2 / 4; font-style: normal; font: 500 11.5px var(--mono); color: var(--muted); }
.dl-list b { font: 650 13px var(--mono); }
.h24 { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 2px; font: 500 10px var(--mono); }
.h24 .hy, .h24 .hx { color: var(--muted); display: grid; place-items: center; height: 18px; } .h24 .hy { height: auto; justify-content: start; }
.h24 .c { height: 24px; border-radius: 5px; background: var(--surface-3); border: 1px solid transparent; padding: 0; min-width: 0; }
.h24 .c.on { border-color: #fff; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
.h24 .c.z { background: rgba(238,241,248,.035); cursor: default; }
.heat-i { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); min-height: 20px; } .heat-i b { color: var(--ink); }
.scale { display: flex; align-items: center; gap: 6px; font: 500 10.5px var(--mono); color: var(--muted); }
.scale i { display: block; width: 14px; height: 10px; border-radius: 3px; }
.cal { display: grid; grid-template-rows: repeat(7, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
.cal .c { aspect-ratio: 1; max-height: 26px; border-radius: 5px; background: var(--surface-3); border: 1px solid transparent; padding: 0; min-width: 0; }
.cal .c.pad { visibility: hidden; } .cal .c.today { box-shadow: inset 0 0 0 1.5px var(--accent-2); }
.cal .c.on { border-color: #fff; }
.cal-w { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; }
.cal-d { display: grid; grid-template-rows: repeat(7, minmax(0, 1fr)); gap: 3px; font: 500 9.5px var(--mono); color: var(--muted); }
.cal-d span { display: flex; align-items: center; }
.streaks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.streaks > div { padding: 10px 12px; border-radius: 12px; background: rgba(22,26,35,.7); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.streaks span { font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; } .streaks b { font: 750 20px var(--sans); letter-spacing: -.02em; }
.streaks b .ico { color: var(--warn); width: 18px; height: 18px; vertical-align: -2px; }

/* leaderboards / lists */
.lbd { display: flex; flex-direction: column; }
.lbd > .li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; }
.lbd > .li:last-child { border-bottom: 0; }
.lbd .rk { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font: 750 12px var(--mono); color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); grid-row: span 2; }
.lbd .li:nth-child(1) .rk { color: #1a1205; background: linear-gradient(135deg, var(--gold), #ffe7a3); border-color: transparent; box-shadow: 0 0 16px color-mix(in srgb, var(--gold) 45%, transparent); }
.lbd .li:nth-child(2) .rk { color: #0d1018; background: linear-gradient(135deg, #cfd6e6, #f4f6fb); border-color: transparent; }
.lbd .li:nth-child(3) .rk { color: #1d0f05; background: linear-gradient(135deg, #d38b52, #f2bd8a); border-color: transparent; }
.lbd .lt { min-width: 0; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbd .lv { font: 650 13px var(--mono); text-align: right; white-space: nowrap; }
.lbd .ls { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.lbd .ls .meter { flex: 1; min-width: 40px; }
button.li:hover .lt, a.li:hover .lt { color: var(--accent-2); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(22,26,35,.55); min-width: 0; }
.item .grow { flex: 1; min-width: 0; } .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.item .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.col { flex-direction: column; align-items: stretch; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert > .ai { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--tc); background: color-mix(in srgb, var(--tc) 13%, transparent); border: 1px solid color-mix(in srgb, var(--tc) 32%, transparent); }
.alert > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; } .alert small { color: var(--ink-2); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.alert .btn { flex: none; }
.feed { display: flex; flex-direction: column; }
.evt { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; font-size: 13px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.evt:last-child { border-bottom: 0; }
.evt .t { font: 500 11.5px var(--mono); color: var(--muted); padding-top: 3px; }
.evt .m { display: flex; gap: 8px; align-items: flex-start; min-width: 0; } .evt .m > span:last-child { min-width: 0; overflow-wrap: anywhere; color: var(--ink-2); }
.tag { display: inline-block; flex: none; font: 700 9.5px var(--sans); letter-spacing: .08em; padding: 3px 7px; border-radius: 6px; margin-top: 1px; background: var(--surface-3); color: var(--ink-2); text-transform: uppercase; }
.tag.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-ink); } .tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.tag.error { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); } .tag.info { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); }

      <div class="note">Earnings are estimates from public view counts × each campaign’s rate. Campaigns pay on the views they verify. ${HOSTED ? 'This page reads data.json, which your PC uploads after every autopilot cycle.' : 'This is the copy on your PC.'}</div></div>`;
  $('#sAcc').onclick = (e) => { const b = e.target.closest('.swatch'); if (!b) return; store.set('accent', b.dataset.v); applyLook(); render(true); };

}
function applyLook() { const r = document.documentElement; r.dataset.accent = store.get('accent', 'indigo'); r.dataset.motion = store.get('motion', true) ? 'on' : 'off'; FX?.retheme?.(); if (r.classList.contains('bg2on') && !BG.raf) BG.raf = requestAnimationFrame(bgFrame); }
const PAGE_FN = { today: pageToday, clips: pageClips, analytics: pageAnalytics, earnings: pageEarnings, campaigns: pageCampaigns, jobs: pageJobs, activity: pageActivity, settings: pageSettings };

// ===================================================================== top bar status + data loading (hosted: data.json every 60 s; from disk: the copy the PC built)
function status() {

  $('#sideWhen').textContent = a.next_run && tms(a.next_run) > Date.now() ? 'next cycle in ' + dur((tms(a.next_run) - Date.now()) / 1000) : 'updated ' + ago(D.generated);

}
function schedule() { clearInterval(timer); if (HOSTED && store.get('auto', true)) timer = setInterval(() => { if (!document.hidden) load(); }, 60000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && D && HOSTED && store.get('auto', true)) load(); });
setInterval(() => { if (D) status(); }, 15000);
let rz, rzW = innerWidth;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (Math.abs(innerWidth - rzW) < 2) return; rzW = innerWidth; if (D) render(true); }, 200); });

// ===================================================================== splash (first open per session) + desktop tilt
const SPLASH_T0 = performance.now();
let splashGone = false;
(function splash() {
  const el = $('#splash');
  let seen = false; try { seen = sessionStorage.getItem('ce.splash') === '1'; sessionStorage.setItem('ce.splash', '1'); } catch (e) { }
  if (seen || store.get('fx', 'max') === 'off' || !motionOn()) { el.remove(); splashGone = true; return; }
  if (!$('#spLogo img')) $('#spLogo').innerHTML = icon('logo', 64);
  const cv = $('#spCv'), g = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.scale(dpr, dpr);
  const cx = W / 2, cy = H / 2 - 40, cols = ['#6d7cff', '#3ee0c8', '#2fe3dc', '#b18cff', '#ffffff'];
  const Pp = Array.from({ length: Math.min(260, Math.round(W * H / 2600)) }, (_, i) => { const a = Math.random() * Math.PI * 2, r = Math.max(W, H) * (0.55 + Math.random() * 0.5);
    return { a, r, s: 0.8 + Math.random() * 2, c: cols[i % cols.length], d: Math.random() * 0.5 }; });

      const x = cx + Math.cos(aa) * rr, y = cy + Math.sin(aa) * rr * (0.55 + 0.45 * (1 - e));

})();
function splashDone() {

setTimeout(splashDone, 6000);   // never stay on the splash, even offline
document.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || !motionOn()) return;
  const t = e.target.closest?.('.tile, .clip'); $$('.tile.tilt, .clip.tilt').forEach(x => { if (x !== t) { x.classList.remove('tilt'); x.style.removeProperty('--rx'); x.style.removeProperty('--ry'); } });

document.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') return; if (e.target.closest?.('button, .tile, .clip, a.btn, .tabs a, .nav a, .swatch, .switch, .li')) haptic(8); }, { passive: true, capture: true });

}
setInterval(tickCD, 1000);
let pxQ = false;
